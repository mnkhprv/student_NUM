  <text x="90" y="165" font-family="Arial, sans-serif" font-size="28" fill="#444">Тооцоо, дуусах хугацаа ба шинэ мэдээлэл</text>
  <rect x="90" y="230" width="1420" height="90" fill="#174ea6"/>
