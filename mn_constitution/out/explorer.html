": "60.2", "kind": "procedure", "actor": "Ерөнхий сайд/дээд шатны Засаг дарга", "summary": "Хурлын нэр дэвшүүлснийг 4 жилээр томилно", "delegates": false, "limits": null, "amended": []}, {"pid": "60.3", "kind": "procedure", "actor": "Ерөнхий сайд", "summary": "Томилохоос татгалзвал дахин нэр дэвшүүлэх; хуучин Засаг дарга хугацаагүй үргэлжлүүлнэ", "delegates": false, "limits": null, "amended": []}], "findings": [57], "modality": {"descriptive": 5}}, {"number": "61", "chapter": 4, "title": "Засаг даргын хориг", "text": "Засаг дарга тухайн Хурлын шийдвэрийг хэрэгжүүлэхийн хамт засаг төрийн төлөөлөгчийн хувьд харьяа нутаг дэвсгэртээ хууль тогтоомж, Засгийн газар, харьяалах дээд шатныхаа байгууллагын шийдвэрийн гүйцэтгэлийг хангах ажлыг Засгийн газар, дээд шатны Засаг даргын өмнө хариуцна. Засаг дарга тухайн аймаг, нийслэл, сум, дүүрэг, баг, хорооны Хурлын шийдвэрт хориг тавих эрхтэй. Тавьсан хоригийг нь Хурал өөрийн төлөөлөгчдийн олонхийн саналаар няцаасан нөхцөлд Засаг дарга уул шийдвэрийг биелүүлэх боломжгүй гэж үзвэл огцрох хүсэлтээ зохих Хурал, Ерөнхий сайд буюу харьяалах дээд шатны Засаг даргад гаргаж болно. Аймаг, нийслэл, сум, дүүргийн Засаг даргын ажлын алба нь тамгын газар мөн. Тамгын газрын бүтэц, орон тооны хязгаарыг Засгийн газар нэг бүрчлэн буюу нэг маягаар тогтооно.", "provisions": [{"pid": "61.2", "kind": "power", "actor": "Засаг дарга", "summary": "Хурлын шийдвэрт хориг тавина", "delegates": false, "limits": null, "amended": []}, {"pid": "61.3", "kind": "procedure", "actor": "Хурал", "summary": "Хурлын олонхи хоригийг няцаавал Засаг дарга огцрох хүсэлт гаргаж «болно»", "delegates": false, "limits": null, "amended": []}], "findings": [15], "modality": {"descriptive": 3, "right": 1, "permission": 1}}, {"number": "62", "chapter": 4, "title": "Нутгийн эрх хэмжээ", "text": "Нутгийн өөрөө удирдах байгууллага тухайн аймаг, нийслэл, сум, дүүрэг, баг, хорооны нутаг дэвсгэрийн хэмжээний эдийн засаг, нийгмийн амьдралын асуудлыг бие дааж шийдвэрлэхийн хамт улс, дээд шатны нэгжийн чанартай асуудлыг шийдвэрлэхэд хүн амыг зохион байгуулж оролцуулна. Нутгийн өөрөө удирдах байгууллагын эрх хэмжээний асуудлыг дээд шатны байгууллага нь шийдвэрлэж үл болно. Хэрэв нутаг дэвсгэрийн амьдралын тодорхой асуудлыг шийдвэрлэх талаар хууль, төрийн зохих дээд байгууллагын шийдвэрт тухайлан заагаагүй бол нутгийн өөрөө удирдах байгууллага Үндсэн хуульд нийцүүлэн бие даан шийдвэрлэж болно. Улсын Их Хурал, Засгийн газраас шаардлагатай хэмээн үзсэн тохиолдолд өөрийн бүрэн эрхэд хамаарах зарим асуудлыг шийдвэрлүүлэхээр аймаг, нийслэлийн Хурал, Засаг даргад шилжүүлж болно.", "provisions": [{"pid": "62.2", "kind": "prohibition", "actor": "дээд шатны байгууллага", "summary": "Нутгийн өөрөө удирдах байгууллагын асуудлыг шийдэхгүй", "delegates": false, "limits": null, "amended": []}], "findings": [], "modality": {"descriptive": 1, "prohibition": 1, "permission": 2}}, {"number": "63", "chapter": 4, "title": "Нутгийн шийдвэр", "text": "Аймаг, нийслэл, сум, дүүрэг, баг, хорооны Хурал эрх хэмжээнийхээ дотор тогтоол, Засаг дарга захирамж гаргана. Хурлын тогтоол, Засаг даргын захирамж нь хууль тогтоомж, Ерөнхийлөгчийн зарлиг, Засгийн газар, харьяалах дээд шатны байгууллагын шийдвэрт нийцсэн байх бөгөөд түүнийг тус тусын нутаг дэвсгэрт хүчин төгөлдөр дагаж мөрдөнө. Засаг захиргаа, нутаг дэвсгэрийн нэгж, түүний удирдлагын эрх хэмжээ, зохион байгуулалт, үйл ажиллагааны журмыг хуулиар тогтооно.", "provisions": [{"pid": "63.3", "kind": "delegation", "actor": "УИХ", "summary": "Нэгжийн эрх хэмжээг хуулиар", "delegates": true, "limits": null, "amended": []}], "findings": [13], "modality": {"descriptive": 3}}, {"number": "64", "chapter": 5, "title": "Үндсэн хуулийн цэц", "text": "Монгол Улсын Үндсэн хуулийн цэц бол Үндсэн хуулийн биелэлтэд дээд хяналт тавих, түүний заалтыг зөрчсөн тухай дүгнэлт гаргах, маргааныг магадлан шийдвэрлэх бүрэн эрх бүхий байгууллага, Үндсэн хуулийг чандлан сахиулах баталгаа мөн. Үндсэн хуулийн цэц, түүний гишүүн үүргээ гүйцэтгэхдээ гагцхүү Үндсэн хуульд захирагдах бөгөөд аливаа байгууллага, албан тушаалтан, бусад хүнээс хараат бус байна. Үндсэн хуулийн цэцийн гишүүний хараат бус байдал Үндсэн хууль, бусад хуулиар тогтоосон баталгаагаар хангагдана.", "provisions": [{"pid": "64.1", "kind": "declaration", "actor": "Цэц", "summary": "Үндсэн хуулийн биелэлтэд дээд хяналт тавина", "delegates": false, "limits": null, "amended": []}, {"pid": "64.2", "kind": "declaration", "actor": "Цэц", "summary": "Гагцхүү Үндсэн хуульд захирагдана, хараат бус", "delegates": false, "limits": null, "amended": []}, {"pid": "64.3", "kind": "delegation", "actor": "УИХ", "summary": "Гишүүний хараат бус байдлын баталгааг хууль", "delegates": true, "limits": null, "amended": []}], "findings": [13, 38], "modality": {"descriptive": 3}}, {"number": "65", "chapter": 5, "title": "Цэцийн бүрэлдэхүүн", "text": "Үндсэн хуулийн цэц есөн гишүүнээс бүрдэнэ. Тэдгээрийн гурвыг Улсын Их Хурал, гурвыг Ерөнхийлөгч, гурвыг Улсын дээд шүүхийн санал болгосноор Улсын Их Хурал зургаан жилийн хугацаагаар томилно. Үндсэн хуулийн цэцийн гишүүнээр хууль зүй, улс төрийн өндөр мэргэшилтэй, Монгол Улсын дөчин нас хүрсэн иргэнийг томилно. Үндсэн хуулийн цэцийн даргаар есөн гишүүний аль нэгийг гурван жилийн хугацаагаар гишүүдийн олонхийн саналаар сонгоно. Түүнийг нэг удаа улируулан сонгож болно. Үндсэн хуулийн цэцийн дарга, гишүүн хууль зөрчвөл Үндсэн хуулийн цэцийн шийдвэр, анх илгээсэн байгууллагын саналыг үндэслэн Улсын Их Хурал эгүүлэн татаж болно. Үндсэн хуулийн цэцийн бүрэлдэхүүнд Ерөнхийлөгч, Улсын Их Хурлын гишүүн, Ерөнхий сайд, Засгийн газрын гишүүн, Улсын дээд шүүхийн шүүгч орж үл болно.", "provisions": [{"pid": "65.1", "kind": "procedure", "actor": "УИХ", "summary": "9 гишүүн (УИХ 3, Ерөнхийлөгч 3, Дээд шүүх 3 нэр дэвшүүлж) бүгдийг УИХ 6 жилээр томилно; ээлжлэлгүй, дахин томилохыг хориглоогүй", "delegates": false, "limits": null, "amended": []}, {"pid": "65.4", "kind": "procedure", "actor": "УИХ", "summary": "Хууль зөрчвөл Цэцийн шийдвэр, илгээсэн байгууллагын саналаар УИХ эгүүлэн татаж болно", "delegates": false, "limits": null, "amended": []}], "findings": [3], "modality": {"descriptive": 4, "permission": 2, "prohibition": 1}}, {"number": "66", "chapter": 5, "title": "Цэцийн бүрэн эрх", "text": "Үндсэн хуулийн цэц нь Үндсэн хуулийг зөрчсөн тухай маргааныг иргэдийн өргөдөл, мэдээллийн дагуу өөрийн санаачилгаар буюу Улсын Их Хурал, Ерөнхийлөгч, Ерөнхий сайд, Улсын дээд шүүх, Улсын ерөнхий прокурорын хүсэлтээр хянан шийдвэрлэнэ. Үндсэн хуулийн цэц энэ зүйлийн 1 дэх хэсэгт заасан үндэслэлээр дараахь маргаантай асуудлаар дүгнэлт гаргаж Улсын Их Хуралд оруулна: хууль, зарлиг, Улсын Их Хурал, Ерөнхийлөгчийн бусад шийдвэр, түүнчлэн Засгийн газрын шийдвэр, Монгол Улсын олон улсын гэрээ Үндсэн хуульд нийцэж байгаа эсэх; ард нийтийн санал асуулга, Улсын Их Хурал, түүний гишүүний ба Ерөнхийлөгчийн сонгуулийн талаар сонгуулийн төв байгууллагын гаргасан шийдвэр Үндсэн хуульд нийцэж байгаа эсэх; Ерөнхийлөгч, Улсын Их Хурлын дарга, гишүүн, Ерөнхий сайд, Засгийн газрын гишүүн, Улсын дээд шүүхийн Ерөнхий шүүгч, Улсын ерөнхий прокурор Үндсэн хууль зөрчсөн эсэх; Ерөнхийлөгч, Улсын Их Хурлын дарга, Ерөнхий сайдыг огцруулах, Улсын Их Хурлын гишүүнийг эгүүлэн татах үндэслэл байгаа эсэх. Энэ зүйлийн 2 дахь хэсгийн 1, 2-т заасны дагуу оруулсан дүгнэлтийг Улсын Их Хурал хүлээн зөвшөөрөөгүй бол Үндсэн хуулийн цэц дахин хянан үзэж эцсийн шийдвэр гаргана. Хууль, зарлиг, Улсын Их Хурал, Ерөнхийлөгчийн бусад шийдвэр, түүнчлэн Засгийн газрын шийдвэр, Монгол Улсын олон улсын гэрээ нь Үндсэн хуульд нийцээгүй гэж Үндсэн хуулийн цэц шийдвэр гаргавал зохих хууль, зарлиг, батламж, шийдвэр хүчингүй болно.", "provisions": [{"pid": "66.1", "kind": "power", "actor": "Цэц", "summary": "Иргэдийн өргөдөл, мэдээлэл, өөрийн санаачилга, эрх бүхий байгууллагын хүсэлтээр хянана", "delegates": false, "limits": null, "amended": []}, {"pid": "66.2", "kind": "procedure", "actor": "Цэц", "summary": "Дүгнэлт гаргаж УИХ-д оруулна", "delegates": false, "limits": null, "amended": []}, {"pid": "66.3", "kind": "procedure", "actor": "Цэц", "summary": "УИХ дүгнэлтийг хүлээн зөвшөөрөөгүй бол дахин хянаж эцсийн шийдвэр (хугацаагүй)", "delegates": false, "limits": null, "amended": []}, {"pid": "66.4", "kind": "procedure", "actor": "Цэц", "summary": "Нийцээгүй гэж шийдвэр гаргавал хууль, шийдвэр хүчингүй", "delegates": false, "limits": null, "amended": []}], "findings": [31, 31, 32, 33, 34, 35, 35, 38], "modality": {"descriptive": 7, "permission": 1}}, {"number": "67", "chapter": 5, "title": "Цэцийн шийдвэрийн хүчин", "text": "Үндсэн хуулийн цэцийн шийдвэр гармагцаа хүчин төгөлдөр болно.", "provisions": [{"pid": "67", "kind": "declaration", "actor": "Цэц", "summary": "Шийдвэр гармагцаа хүчин төгөлдөр", "delegates": false, "limits": null, "amended": []}], "findings": [], "modality": {"permission": 1}}, {"number": "68", "chapter": 6, "title": "Нэмэлт өөрчлөлтийн санаачилга", "text": "Үндсэн хуульд нэмэлт, өөрчлөлт оруулах санаачилгыг хууль санаачлах эрх бүхий байгууллага, албан тушаалтан гаргах бөгөөд саналыг Үндсэн хуулийн цэц Улсын Их Хуралд өргөн мэдүүлж болно. Үндсэн хуульд нэмэлт, өөрчлөлт оруулах асуудлаар Улсын Их Хурлын гишүүдийн гуравны хоёроос доошгүйн саналаар ард нийтийн санал асуулга явуулж болно. Санал асуулгыг Үндсэн хуулийн хорин тавдугаар зүйлийн 1 дэх хэсгийн 16-д заасан үндэслэлийн дагуу явуулна.", "provisions": [{"pid": "68.1", "kind": "procedure", "actor": "хууль санаачлагч, Цэц", "summary": "Санаачилга (иргэний санаачилгагүй)", "delegates": false, "limits": null, "amended": []}, {"pid": "68.2", "kind": "procedure", "actor": "УИХ", "summary": "2/3-оор санал асуулга явуулж «болно» (заавал биш)", "delegates": false, "limits": null, "amended": []}], "findings": [58], "modality": {"permission": 2, "descriptive": 1}}, {"number": "69", "chapter": 6, "title": "Батлах журам", "text": "Үндсэн хууль, түүнд оруулах нэмэлт, өөрчлөлтийг Улсын Их Хурлын нийт гишүүний дөрөвний гурваас доошгүйн саналаар батална. Үндсэн хуульд оруулах нэмэлт, өөрчлөлтийг Улсын Их Хуралд хоёр удаа авч хэлэлцэхэд ийнхүү нийт гишүүний дөрөвний гурваас доошгүйн санал авч эс чадвал уул төслийг ээлжит сонгуулиар сонгогдсон Улсын Их Хурлын шинэ бүрэлдэхүүн ажлаа эхэлтэл дахин авч хэлэлцэхгүй. Улсын Их Хурал ээлжит сонгууль явуулахын өмнөх зургаан сарын дотор Үндсэн хуульд нэмэлт, өөрчлөлт оруулж үл болно. Үндсэн хуульд оруулсан нэмэлт, өөрчлөлт Үндсэн хуулийн нэгэн адил хүчинтэй байна.", "provisions": [{"pid": "69.1", "kind": "procedure", "actor": "УИХ", "summary": "Нийт гишүүний 3/4-өөр батална", "delegates": false, "limits": null, "amended": []}, {"pid": "69.2", "kind": "procedure", "actor": "УИХ", "summary": "Хоёр удаа унасан төслийг шинэ бүрэлдэхүүн хүртэл хэлэлцэхгүй", "delegates": false, "limits": null, "amended": []}, {"pid": "69.3", "kind": "prohibition", "actor": "УИХ", "summary": "ЭЭЛЖИТ сонгуулийн өмнөх 6 сард өөрчлөхийг хориглоно (ээлжит бус сонгуульд хамаарахгүй)", "delegates": false, "limits": null, "amended": []}, {"pid": "69.4", "kind": "declaration", "actor": "", "summary": "Нэмэлт өөрчлөлт Үндсэн хуулийн адил хүчинтэй (өөрчлөгдөшгүй цөм алга)", "delegates": false, "limits": null, "amended": []}], "findings": [1, 8], "modality": {"descriptive": 3, "prohibition": 1}}, {"number": "70", "chapter": 6, "title": "Үндсэн хуулийн дээд байдал", "text": "Үндсэн хуульд хууль, зарлиг, төрийн байгууллагын бусад шийдвэр, нийт байгууллага, иргэний үйл ажиллагаа бүрнээ нийцсэн байвал зохино. Монгол Улсын Үндсэн хуулийг 1992 оны хоёрдугаар сарын 12-ны өдрийн 12 цаг буюу арван долдугаар жарны усан бичин жилийн хаврын тэргүүн хар барс сарын шинийн есний идрийн барилдлагаатай өлзийт сайн шар морин өдрийн морин цагаас эхлэн улс даяар дагаж мөрдөнө.", "provisions": [{"pid": "70.1", "kind": "declaration", "actor": "бүх байгууллага, иргэн", "summary": "Үндсэн хуульд бүрнээ нийцсэн «байвал зохино» (зөвлөмжийн хэлбэр)", "delegates": false, "limits": null, "amended": []}, {"pid": "70.2", "kind": "declaration", "actor": "", "summary": "1992-02-12-ны 12 цагаас дагаж мөрдөнө", "delegates": false, "limits": null, "amended": []}], "findings": [9], "modality": {"soft": 1, "descriptive": 1}}], "findings": [{"rule": "SCOPE_AMBIGUITY", "severity": "critical", "category": "bug", "articles": ["33.1.1", "43.1", "25.1.6"], "title": "[ХУУЛЬД ХОЛБОГДОХ ЗААЛТ БИЙ] Ерөнхийлөгчийн хориг «бусад шийдвэр»-т хамаарах хүрээ тодорхойгүй (Ерөнхий сайдыг огцруулах тогтоол орох уу?)", "detail": "43.1 огцруулах тогтоолыг «баталсанд тооцож» гэж автоматаар хүчин төгөлдөр болгодог; 33.1.1 «бусад шийдвэр»-т хориг тавих эрх олгоно. Хоёрын аль нь давамгайлах нь заагаагүй. Хуулийн түвшинд: Хуулийн «тогтоол» гэсэн ерөнхий үг огцруулах тогтоолыг хамрах эсэхийг тодорхой болгоогүй.", "evidence": "[TEXT: 33.1.1] «хууль, бусад шийдвэрт бүхэлд нь буюу зарим хэсэгт нь хориг тавих» [TEXT: 43.1] «Ерөнхий сайдыг огцруулах тухай Улсын Их Хурлын тогтоол баталсанд тооцож» [CASE: 2025.10.17 огцруулалт → 10.20 хориг → 10.22 Цэц] [TEXT law 17140612614151 46.5: «тухайн хууль, тогтоолыг бүхэлд нь буюу түүний зарим хэсэгт хориг тавих»]", "fix": "33.1.1 (нэмэлт): «Ерөнхий сайдыг томилох, огцруулах, итгэл үзүүлэх тухай Улсын Их Хурлын тогтоолд Ерөнхийлөгч хориг тавих эрхгүй.»"}, {"rule": "SELF_ENTRENCHMENT", "severity": "critical", "category": "design", "articles": ["69.1", "21.1", "21.2", "22.1"], "title": "95/126 суудалтай нэг нам Үндсэн хуулийг, түүний дотор сонгуулийн тогтолцоо, бүрэн эрхийн хугацааг дангаараа өөрчилнө", "detail": "Өөрчлөгдөшгүй цөм, давхар батлалт, заавал санал асуулга алга. 2016 (65/76=85%), 2020 (62/76=82%) онд нэг нам энэ босгоос дээш байсан; 2023 оны 21.1-ийн өөрчлөлтийг яг ийм бүрэлдэхүүн баталсан.", "evidence": "[TEXT: 69.1] «нийт гишүүний дөрөвний гурваас доошгүйн саналаар батална» [CASE: CRS 2024; ConstitutionNet 2023]", "fix": "69.5 (шинэ): «Улсын Их Хурлын бүрэн эрхийн хугацаа, бүрэлдэхүүн, сонгуулийн тогтолцоо, Ерөнхийлөгчийн бүрэн эрхийн хугацааг өөрчлөх нэмэлт, өөрчлөлт нь дараагийн ээлжит сонгуулиар бүрдсэн Улсын Их Хурал нийт гишүүний гуравны хоёрын саналаар дахин батлах буюу ард нийтийн санал асуулгаар дэмжигдэхээс өмнө хүчин төгөлдөр болохыг хориглоно.»"}, {"rule": "UNDEFINED_TRANSITION", "severity": "critical", "category": "bug", "articles": ["Ерөнхий сайдыг огцруулах (43, 33.1.1, 22.3, 66)"], "title": "[ХУУЛЬД ХОЛБОГДОХ ЗААЛТ БИЙ] Ерөнхий сайдыг огцруулах (43, 33.1.1, 22.3, 66): «DISMISSED» төлөвт «president_veto» болбол юу болох нь заагаагүй", "detail": "33.1.1 «бусад шийдвэр» огцруулах тогтоолыг хамрах эсэх тодорхойгүй; хамарвал 43.1-ийн нийт олонхийн шийдвэрийг оролцсон гишүүний 2/3-оор л сэргээх боломжтой Хуулийн түвшинд: Хууль хоригийг «хууль, тогтоол»-д ерөнхийд нь хэрэглэнэ, огцруулах тогтоолыг тусгайлан оруулаагүй, хасаагүй. 2025 оны хэрэг энэ асуудал хуулийн түвшинд ч шийдэгдээгүйг харуулсан.", "evidence": "[CASE: 2025.10.17 огцруулсан тогтоолд Ерөнхийлөгч 10.20-нд хориг тавьсан; Цэц 10.22-нд тогтоолыг Үндсэн хуульд нийцээгүй гэж шийдсэн] [TEXT law 17140612614151 46.5: «тухайн хууль, тогтоолыг бүхэлд нь буюу түүний зарим хэсэгт хориг тавих»] [TEXT law 17140612614151 101.4: «Ерөнхий сайдыг огцруулах тухай тогтоол баталсанд тооцно»]", "fix": ""}, {"rule": "COURT_UNSTAGGERED", "severity": "high", "category": "design", "articles": ["65.1"], "title": "Цэцийн 9 гишүүнийг бүгдийг УИХ томилно; ээлжлэх, дахин томилохыг хориглох заалт алга", "detail": "Нэр дэвшүүлэх эрх гурван байгууллагад хуваагдсан ч эцсийн томилгоо нэг байгууллагад. Шинэ олонх Цэцийг богино хугацаанд бүрэн солих боломжтой.", "evidence": "[TEXT: 65.1] «Улсын Их Хурал зургаан жилийн хугацаагаар томилно»", "fix": "65.1 (нэмэлт): «Гишүүдийн гуравны нэгийг хоёр жил тутам ээлжлэн томилно. Гишүүнийг дахин томилохыг хориглоно.»"}, {"rule": "MISSING_APPOINTER", "severity": "high", "category": "bug", "articles": ["49.5"], "title": "Шүүхийн ерөнхий зөвлөлийн 5 гишүүнийг ХЭН томилохыг Үндсэн хууль заагаагүй", "detail": "Үйлдэгчгүй идэвхгүй хэв: «нэр дэвшүүлж томилно». Томилогчийг хууль тогтооно — шүүхийн хараат бус байдлын гол цэгийг энгийн олонхид даатгасан.", "evidence": "[TEXT: 49.5] «бусад таван гишүүнийг нээлттэйгээр нэр дэвшүүлж томилно»", "fix": "49.5 (өөрчлөлт): «...бусад таван гишүүнийг нээлттэй сонгон шалгаруулалтаар нэр дэвшүүлж, Улсын Их Хурал нийт гишүүний гуравны хоёрын саналаар томилно.»"}, {"rule": "NO_CLIMATE_WATER", "severity": "high", "category": "design", "articles": ["6.1", "5.5", "16.2"], "title": "Ус, бэлчээрийн даац, зуд, уур амьсгалын өөрчлөлтөд төрийн тодорхой үүрэг алга", "detail": "Ус «ард түмний мэдэл» (6.1), мал «төрийн хамгаалалтад» (5.5) — хоёулаа тодорхойлох хэлбэр, үүрэг хүлээгч ба үр дагаваргүй. Уурхай ба малчны усны тэргүүлэх дараалал алга.", "evidence": "[TEXT: 5.5] «Мал сүрэг бол үндэсний баялаг мөн бөгөөд төрийн хамгаалалтад байна»", "fix": "6.6 (шинэ): «Ундны болон малын усны хэрэгцээг ашигт малтмал олборлохоос түрүүлж хангах үүрэгтэй. Малчдын цорын ганц усны эх үүсвэрийг хомсдуулах тусгай зөвшөөрөл олгохыг хориглоно.»"}, {"rule": "RIGHTS_BY_STATUTE", "severity": "high", "category": "design", "articles": ["15.1", "16.5", "16.6", "16.8", "16.9", "16.13", "16.16", "18.1"], "title": "Хүний эрхийн 8 заалтын хүрээг хууль тогтооно, хязгаарлах шалгуургүй", "detail": "19.2 зөвхөн онц байдлын үеийн хязгаарлалтыг хамарна; энгийн үеийн хязгаарлалтад зорилго, зайлшгүй, пропорциональ шалгуур алга.", "evidence": "[TEXT: 16.16] «Жагсаал, цуглаан хийх журмыг хуулиар тогтооно»", "fix": "19.4 (шинэ): «Хүний эрх, эрх чөлөөг хязгаарлах хууль нь хууль ёсны зорилготой, зайлшгүй шаардлагатай, зорилгодоо пропорциональ байх бөгөөд эрхийн мөн чанарыг хөндөхийг хориглоно.»"}, {"rule": "SELF_EXTENSION", "severity": "high", "category": "bug", "articles": ["22.1", "25.1.18"], "title": "[ХУУЛИАР ХЭСЭГЧЛЭН ХААГДСАН] УИХ онц байдал зарлаж, сонгуулийг хойшлуулан бүрэн эрхээ хязгааргүй сунгах боломжтой", "detail": "Онц байдлыг УИХ өөрөө зарлаж (25.1.18), «нөхцөл арилтал» бүрэн эрхээ хадгална (22.1). Дээд хугацаа, гуравдагч (Цэц) баталгаажуулалт алга. Хуулийн түвшинд: Хугацаа, сунгалтын журам, онц байдлын үед Үндсэн хуулийг өөрчлөхийг хориглосон заалт хуульд бий. Гэхдээ сунгалтын дээд хязгаар алга, ҮАБЗ-ийн 3 гишүүний 2 нь ихэвчлэн УИХ-ын олонхийн төлөөлөл; 22.1-ийн сонгууль хойшлох механизм хөндөгдөөгүй.", "evidence": "[TEXT: 22.1] «мөнхүү нөхцөл арилж, шинэ сонгогдсон гишүүдээ тангараг өргөтөл Улсын Их Хурал бүрэн эрхээ хэрэгжүүлнэ» [TEXT law 433 5.7: «онц байдал үргэлжлэх хугацаа /эхлэх, дуусах он, сар, өдөр, цаг/»] [TEXT law 433 6.2: «Үндэсний аюулгүй байдлын зөвлөлийн саналыг үндэслэн Улсын Их Хурал онц байдлын үргэлжлэх хугацааг сунгаж болно»] [TEXT law 433 19: «Үндсэн хуульд нэмэлт, өөрчлөлт оруулж болохгүй»]", "fix": "22.1 (нэмэлт): «Энэ үндэслэлээр бүрэн эрхийг сунгах хугацаа зургаан сараас хэтрэхийг хориглоно. Сунгах тухай шийдвэрийг Үндсэн хуулийн цэц 14 хоногийн дотор хянах үүрэгтэй.»"}, {"rule": "SNAP_ELECTION_GAP", "severity": "high", "category": "bug", "articles": ["69.3", "21.4", "22.2"], "title": "Ээлжит бус сонгуулийн өмнө Үндсэн хууль, сонгуулийн хуулийг өөрчлөх хориг үйлчлэхгүй", "detail": "69.3 ба 21.4 зөвхөн «ээлжит» сонгуулийг хамарна. 22.2-оор өөрөө тарах шийдвэр гаргасан олонх өөрчлөлтөө хийгээд шууд сонгууль руу орж болно.", "evidence": "[TEXT: 69.3] «ээлжит сонгууль явуулахын өмнөх зургаан сарын дотор» [TEXT: 21.4] «ээлжит сонгууль явуулахын өмнөх нэг жилийн дотор»", "fix": "69.3 (өөрчлөлт): «...ээлжит болон ээлжит бус сонгууль явуулахын өмнөх зургаан сарын дотор, түүнчлэн тарах шийдвэр гарснаас хойш...»"}, {"rule": "SOFT_SUPREMACY", "severity": "high", "category": "text", "articles": ["70.1"], "title": "Үндсэн хуулийн дээд байдлын заалт зөвлөмжийн «байвал зохино» хэлбэртэй", "detail": "Бусад бүх хэм хэмжээ «хориглоно / -на» хэлбэртэй атал хамгийн суурь заалт нь «should» утгатай.", "evidence": "[TEXT: 70.1] «бүрнээ нийцсэн байвал зохино»", "fix": "70.1 (өөрчлөлт): «...Үндсэн хуульд бүрнээ нийцсэн байх үүрэгтэй. Үндсэн хуульд нийцээгүй акт хүчин төгөлдөр бус байна.»"}, {"rule": "STALL_POINT", "severity <script>
const D = JSON.parse(document.getElementById('data').textContent);
const SEV = {critical:'Ноцтой',high:'Өндөр',medium:'Дунд',low:'Бага'};
const CAT = {bug:'Алдаа',design:'Загварын сул тал',text:'Найруулга'};
const VER = {pass:'Тэнцсэн',partial:'Хэсэгчлэн',fail:'Унасан'};
const KIND = {right:'эрх',duty:'үүрэг',prohibition:'хориг',power:'бүрэн эрх',procedure:'процедур',declaration:'тунхаг',delegation:'хуульд шилжүүлэх'};
const CH = {1:'I. Бүрэн эрхт байдал',2:'II. Хүний эрх',3:'III. Төрийн байгуулал',4:'IV. Засаг захиргаа',5:'V. Үндсэн хуулийн цэц',6:'VI. Нэмэлт өөрчлөлт'};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = s => document.querySelector(s);
const store = {get(k,d){try{return JSON.parse(localStorage.getItem(k)) ?? d}catch{return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

$('#fetched').textContent = D.fetched;
const s = D.summary;
$('#strip').innerHTML = [
  ['', s.articles, 'зүйл шалгасан'], ['', s.findings, 'олдвор'],
  ['crit', s.by_severity.critical||0, 'ноцтой'], ['high', s.by_severity.high||0, 'өндөр'],
  ['', s.by_category.bug||0, 'процедурын алдаа'], ['', `${s.stress.fail||0}/7`, 'стресс тест унасан']
].map(([c,v,l]) => `<div class="stat ${c}"><b>${v}</b><span>${l}</span></div>`).join('');

const TABS = [['findings','Олдворууд'],['articles','Зүйлүүд'],['stress','Стресс тест'],['procedures','Процедурын гацаа'],['numbers','Тоо ба хэл']];
let tab = TABS.some(t => '#'+t[0] === location.hash) ? location.hash.slice(1) : 'findings';
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(([id,l]) => `<button role="tab" id="t-${id}" aria-selected="${id===tab}" data-tab="${id}">${l}</button>`).join('');
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.some(t=>t[0]===h)) { tab = h; render(); } });
function go(t, art){ tab = t; if (art) curArt = art; try{ history.replaceState(null,'','#'+t) }catch{} render(); window.scrollTo({top:0}); }

const artLinks = arr => arr.map(a => /^[\d¹.]+[a-z]?$/.test(a) && D.articles.some(x => x.number === a.split('.')[0])
  ? `<button class="art" data-art="${esc(a.split('.')[0])}">${esc(a)}</button>` : `<span>${esc(a)}</span>`).join(' ');

function issueHTML(f, open=false){
  return `<details class="issue sev-${f.severity}" ${open?'open':''}>
    <summary><span class="pill">${SEV[f.severity]}</span><span class="t">${esc(f.title)}</span>
    <span class="meta"><span>${CAT[f.category]}</span><span>·</span>${artLinks(f.articles)}</span></summary>
    <div class="body">
      ${f.detail ? `<p>${esc(f.detail)}</p>` : ''}
      ${f.evidence ? `<div><span class="lbl">Нотолгоо</span><div class="ev">${esc(f.evidence)}</div></div>` : ''}
      ${f.fix ? `<div><span class="lbl">Санал болгож буй засвар</span><div class="fix">${esc(f.fix)}</div></div>` : ''}
      <span class="lbl">Дүрэм: ${esc(f.rule)}</span>
    </div></details>`;
}

let fSev = store.get('fSev', []), fCat = store.get('fCat', []), fq = '';
function viewFindings(){
  const chips = (obj, sel, key) => Object.entries(obj).map(([k,l]) => `<button class="chip" data-${key}="${k}" aria-pressed="${sel.includes(k)}">${l}</button>`).join('');
  const list = D.findings.filter(f => (!fSev.length || fSev.includes(f.severity)) && (!fCat.length || fCat.includes(f.category))
    && (!fq || (f.title+f.detail+f.evidence+f.articles.join(' ')).toLowerCase().includes(fq.toLowerCase())));
  return `<div class="filters">${chips(SEV,fSev,'sev')}<span class="count">·</span>${chips(CAT,fCat,'cat')}
    <input type="search" id="fq" placeholder="Хайх: зүйл, үг (жишээ: Цэц, 33.1.1)" value="${esc(fq)}" aria-label="Олдвор хайх">
    <span class="count">${list.length}/${D.findings.length}</span></div>
    <div class="issues">${list.map(f => issueHTML(f)).join('') || '<p class="note">Шүүлтүүрт тохирох олдвор алга.</p>'}</div>`;
}

let curArt = store.get('art', '33');
function highlight(text, findings){
  let t = esc(text);
  const quotes = findings.flatMap(f => [...f.evidence.matchAll(/«([^»]{6,})»/g)].map(m => m[1]));
  for (const qq of [...new Set(quotes)].sort((a,b)=>b.length-a.length)) {
    const e = esc(qq); if (t.includes(e)) t = t.split(e).join(`<mark>${e}</mark>`);
  }
  return t;
}
function viewArticles(){
  const byCh = {};
  D.articles.forEach(a => (byCh[a.chapter] ||= []).push(a));
  const side = Object.entries(byCh).map(([c, arr]) => `<h3>${CH[c]}</h3>` + arr.map(a => {
    const sev = [...new Set(a.findings.map(i => D.findings[i].severity))];
    return `<button data-art="${esc(a.number)}" aria-current="${a.number===curArt}"><span class="n">${esc(a.number)}</span><span>${esc(a.title)}</span>
      <span class="dots">${sev.map(s => `<i class="dot sev-${s}" title="${SEV[s]}"></i>`).join('')}</span></button>`;
  }).join('')).join('');
  const a = D.articles.find(x => x.number === curArt) || D.articles[0];
  const fs = a.findings.map(i => D.findings[i]);
  return `<div class="two"><div class="alist" role="navigation" aria-label="Зүйлүүд">${side}</div>
    <div class="reader"><h2>${esc(a.number)} дүгээр зүйл · ${esc(a.title)}</h2>
      <div class="statute">${highlight(a.text, fs)}</div>
      <span class="lbl">Загварын заалтууд</span>
      <div class="tablewrap"><table class="prov"><thead><tr><th>Заалт</th><th>Төрөл</th><th>Хэн</th><th>Агуулга</th></tr></thead><tbody>
      ${a.provisions.map(p => `<tr><td class="kind">${esc(p.pid)}</td><td class="kind">${KIND[p.kind]}${p.delegates&&!p.limits?' ⚠':''}</td><td>${esc(p.actor||'—')}</td><td>${esc(p.summary)}${p.amended.length?` <span class="note">(${p.amended.join(', ')})</span>`:''}</td></tr>`).join('')}
      </tbody></table></div>
      <div style="margin-top:16px"><span class="lbl">Энэ зүйлийн олдвор (${fs.length})</span>
      <div class="issues">${fs.map(f => issueHTML(f)).join('') || '<p class="note">Олдвор алга.</p>'}</div></div>
    </div></div>`;
}

function viewStress(){
  return `<div class="grid2">${D.stress.map(r => `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:start">
    <h2>${r.n}. ${esc(r.title)}</h2><span class="verdict v-${r.verdict}">${VER[r.verdict]}</span></div>
    <p style="margin:8px 0 0">${esc(r.break_point)}</p><div class="trace">${r.trace.map(esc).join(' ')}</div>
    ${r.verdict_laws ? `<div style="margin-top:10px;padding-top:8px;border-top:1px dashed currentColor"><div style="display:flex;justify-content:space-between;gap:10px"><b>⚖ Хуультай хамт</b><span class="verdict v-${r.verdict_laws}">${VER[r.verdict_laws]}</span></div>
    <p style="margin:6px 0 0">${esc(r.note_laws)}</p><div class="trace">${r.trace_laws.map(esc).join(' ')}</div></div>` : ''}</div>`).join('')}</div>`;
}

function viewProcedures(){
  return `<p class="note" style="margin-top:0">Процедур бүрийг төлөвт машин болгосон. Улаан мөр: бодит амьдралд тохиолдож болох үйл явдал боловч Үндсэн хууль үр дагаврыг нь заагаагүй.</p>
  <div class="grid2">${D.machines.map(m => `<div class="card"><h2>${esc(m.title)}</h2><div class="fsm">
    ${m.transitions.map(t => `<div class="ok">${esc(t.from)} —${esc(t.event)}→ ${esc(t.to)} <span>[${esc(t.pid)}${t.deadline!=null?', '+t.deadline+' хоног':''}]</span></div>`).join('')}
    ${m.undefined.map(u => `<div class="bad">${esc(u.state)} —${esc(u.event)}→ ??? </div><div class="note" style="margin:0 0 4px 12px;font-family:var(--f-body)">${esc(u.note)}</div>`).join('')}
    ${layerOf(m.name)}
  </div></div>`).join('')}</div>`;
}

function layerOf(name){
  const l = (D.layers||[]).find(x => x.name === name);
  if (!l || (!l.statute_edges.length && !Object.keys(l.state_notes).length)) return '';
  return `<div class="note" style="margin:10px 0 4px;font-family:var(--f-body)"><b>⚖ Энгийн хуулиар нэмэгдсэн</b> — тодорхойгүй ${l.undefined.constitution}→${l.undefined.with_statute}, гацаа ${l.stalls.constitution}→${l.stalls.with_statute}${l.deadline_without_consequence.length ? '; хугацаатай ч үр дагаваргүй: '+l.deadline_without_consequence.map(esc).join(', ') : ''}</div>
    ${l.statute_edges.map(e => `<div class="ok" style="opacity:.85">⚖ ${esc(e.from)} —${esc(e.event)}→ ${esc(e.to)} <span>[${esc(e.cite)}]</span></div>`).join('')}
    ${Object.entries(l.state_notes).map(([st,n]) => `<div class="note" style="margin:0 0 4px 12px;font-family:var(--f-body)">${esc(st)}: ${esc(n)}</div>`).join('')}`;
}

function viewNumbers(){
  const L = D.linguistics, tot = L.sentences;
  const MOD = {descriptive:'Тодорхойлох «-на/-нэ»',permission:'Зөвшөөрөл «болно»',prohibition:'Хориг',right:'Эрх «эрхтэй»',obligation:'Үүрэг «үүрэгтэй»',soft:'Зөвлөмж «байвал зохино»'};
  const mods = Object.entries(L.modality).sort((a,b)=>b[1]-a[1]);
  const cap = D.capture;
  return `<div class="grid2">
   <div class="card"><h2>Нэг нам дангаараа юу хийж чадах вэ</h2>
    <p class="note">126 суудлаас шаардлагатай тоо. Улаан тэмдэг: 2016 (85%), 2020 (82%) онд нэг нам эзэмшиж байсан хувь.</p>
    <div class="bars cap">${cap.map(c => `<div class="bar"><span>${esc(c.power)} <span class="kind">${esc(c.pid)}</span></span>
      <div class="track"><div class="fill ${c.share<=0.82?'over':''}" style="width:${c.share*100}%"></div></div><span class="num">${c.seats_needed}</span></div>`).join('')}</div>
    <p class="note">Үндсэн хуулийг өөрчлөх босго (95) 2016, 2020 оны нэг намын суудлаас доогуур байсан тул бүх мөр улаан.</p></div>
   <div class="card"><h2>Хэм хэмжээний хэлбэр</h2>
    <p class="note">Монгол эхийн ${tot} өгүүлбэрийг модаль хэлбэрээр ангилсан (regex, ойролцоо).</p>
    <div class="bars">${mods.map(([k,v]) => `<div class="bar"><span>${MOD[k]||k}</span><div class="track"><div class="fill" style="width:${v/tot*100}%"></div></div><span class="num">${v}</span></div>`).join('')}</div>
    <p class="note">«Хуулиар тогтооно / хуульд заасан / хуулийн дагуу» хэлбэр: <b>${L.delegation_count}</b> удаа.</p></div>
   <div class="card"><h2>Нэмэлт, өөрчлөлтийн тэмдэглэл</h2>
    <p class="note">Монгол эх дэх «/Энэ хэсгийг ... өөрчлөн найруулсан/» тэмдэглэлүүд.</p>
    <div class="bars">${Object.entries(D.amendments.reduce((acc,a)=>{a.years.filter(y=>y<2028).forEach(y=>acc[y]=(acc[y]||0)+1);return acc},{})).map(([y,n],_,arr)=>{const mx=Math.max(...arr.map(x=>x[1]));return `<div class="bar"><span>${y} он</span><div class="track"><div class="fill" style="width:${n/mx*100}%"></div></div><span class="num">${n}</span></div>`}).join('')}</div>
    <p class="note">Цэцийн шийдвэрээр хүчингүй болсон өөрчлөлт: ${D.amendments.filter(a=>a.annulled_by_tsets).length} заалт (1999 оны багц, 2000 оны 02 тогтоол).</p></div>
  </div>`;
}

function render(){
  renderTabs();
  $('#view').innerHTML = {findings:viewFindings, articles:viewArticles, stress:viewStress, procedures:viewProcedures, numbers:viewNumbers}[tab]();
}
$('#view').addEventListener('click', e => {
  const art = e.target.closest('[data-art]');
  if (art) { e.preventDefault(); curArt = art.dataset.art; store.set('art', curArt); go('articles'); return; }
  const sv = e.target.closest('[data-sev]'), ct = e.target.closest('[data-cat]');
  if (sv) { const k = sv.dataset.sev; fSev = fSev.includes(k) ? fSev.filter(x=>x!==k) : [...fSev,k]; store.set('fSev',fSev); render(); }
  if (ct) { const k = ct.dataset.cat; fCat = fCat.includes(k) ? fCat.filter(x=>x!==k) : [...fCat,k]; store.set('fCat',fCat); render(); }
});
$('#view').addEventListener('input', e => {
  if (e.target.id === 'fq') { fq = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#fq'); i.focus(); i.setSelectionRange(pos,pos); }
});
render();
</script>
