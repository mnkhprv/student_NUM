    <p class="sub">Үндсэн хуулийн 71 зүйлийг программын код мэт загварчилж, автомат шалгагчаар ажиллуулсан үр дүн. Бүх ишлэл <a href="https://legalinfo.mn/mn/detail?lawId=367">legalinfo.mn</a>-ийн монгол эхээс үгчлэн авсан (татсан огноо <span id="fetched"></span>). Засварууд нь шинжилгээний санал бөгөөд УИХ-д өргөн мэдүүлсэн төсөл биш.</p>

риглоно.", "provisions": [{"pid": "3.1", "kind": "declaration", "actor": "ард түмэн", "summary": "Засгийн бүх эрх ард түмний мэдэлд; шууд ба төлөөллөөр эдэлнэ", "delegates": false, "limits": null, "amended": []}, {"pid": "3.2", "kind": "prohibition", "actor": "", "summary": "Төрийн эрх мэдлийг хууль бусаар авахыг хориглоно", "delegates": false, "limits": null, "amended": []}], "findings": [41], "modality": {"descriptive": 1, "right": 1, "prohibition": 1}}, {"number": "4", "chapter": 1, "title": "Нутаг дэвсгэр, хил", "text": "Монгол Улсын нутаг дэвсгэрийн бүрэн бүтэн байдал, улсын хил халдашгүй дархан байна. Монгол Улсын хилийг хуулиар бататгана. Хууль гаргахгүйгээр гадаадын цэргийн хүчнийг Монгол Улсын нутаг дэвсгэрт байрлуулах, дамжин өнгөрүүлэхээр улсын хил нэвтрүүлэхийг хориглоно.", "provisions": [{"pid": "4.1", "kind": "declaration", "actor": "", "summary": "Нутаг дэвсгэрийн бүрэн бүтэн байдал, хил халдашгүй", "delegates": false, "limits": null, "amended": []}, {"pid": "4.2", "kind": "delegation", "actor": "УИХ", "summary": "Хилийг хуулиар бататгана", "delegates": true, "limits": null, "amended": []}, {"pid": "4.3", "kind": "prohibition", "actor": "УИХ", "summary": "Хуульгүйгээр гадаадын цэрэг байрлуулах, дамжуулахыг хориглоно", "delegates": false, "limits": null, "amended": [2019]}], "findings": [13], "modality": {"descriptive": 2, "prohibition": 1}}, {"number": "5", "chapter": 1, "title": "Эдийн засаг, өмч", "text": "Монгол Улс дэлхийн эдийн засгийн хөгжлийн түгээмэл хандлага, өөрийн орны өвөрмөц онцлогт нийцсэн олон хэвшил бүхий эдийн засагтай байна. Төр нь нийтийн болон хувийн өмчийн аливаа хэлбэрийг хүлээн зөвшөөрч, өмчлөгчийн эрхийг хуулиар хамгаална. Өмчлөгчийн эрхийг гагцхүү хуульд заасан үндэслэлээр хязгаарлаж болно. Төр нь үндэсний эдийн засгийн аюулгүй байдал, аж ахуйн бүх хэвшлийн болон хүн амын нийгмийн хөгжлийг хангах зорилгод нийцүүлэн эдийн засгийг зохицуулна. Мал сүрэг бол үндэсний баялаг мөн бөгөөд төрийн хамгаалалтад байна.", "provisions": [{"pid": "5.1", "kind": "declaration", "actor": "", "summary": "Олон хэвшил бүхий эдийн засаг", "delegates": false, "limits": null, "amended": []}, {"pid": "5.2", "kind": "duty", "actor": "төр", "summary": "Өмчийн бүх хэлбэрийг хүлээн зөвшөөрч, өмчлөгчийн эрхийг хуулиар хамгаална", "delegates": true, "limits": null, "amended": []}, {"pid": "5.3", "kind": "delegation", "actor": "УИХ", "summary": "Өмчлөгчийн эрхийг гагцхүү хуульд заасан үндэслэлээр хязгаарлана", "delegates": true, "limits": "зөвхөн хуулиар (зорилго, пропорциональ шалгуургүй)", "amended": []}, {"pid": "5.4", "kind": "duty", "actor": "төр", "summary": "Эдийн засгийг зохицуулна", "delegates": false, "limits": null, "amended": []}, {"pid": "5.5", "kind": "declaration", "actor": "төр", "summary": "Мал сүрэг үндэсний баялаг, төрийн хамгаалалтад", "delegates": false, "limits": null, "amended": []}], "findings": [5, 13], "modality": {"descriptive": 4, "permission": 1}}, {"number": "6", "chapter": 1, "title": "Байгалийн баялаг, газар", "text": "Монгол Улсад газар, түүний хэвлий, ой, ус, амьтан, ургамал болон байгалийн бусад баялаг гагцхүү ард түмний мэдэл, төрийн хамгаалалтад байна. Монгол Улсын иргэдэд өмчлүүлснээс бусад газар, түүнчлэн газрын хэвлий, түүний баялаг, ой, усны нөөц, ан амьтан төрийн нийтийн өмч мөн. Байгалийн баялгийг ашиглах төрийн бодлого нь урт хугацааны хөгжлийн бодлогод тулгуурлаж, одоо ба ирээдүй үеийн иргэн бүрд эрүүл, аюулгүй орчинд амьдрах эрхийг нь баталгаажуулах, газрын хэвлийн баялгийн үр өгөөжийг Үндэсний баялгийн санд төвлөрүүлж тэгш, шударга хүртээхэд чиглэнэ. Иргэн эрүүл, аюулгүй орчинд амьдрах эрхийнхээ хүрээнд газрын хэвлийн баялгийг ашигласнаар байгаль орчинд үзүүлэх нөлөөллийн талаар мэдэх эрхтэй. Стратегийн ач холбогдол бүхий ашигт малтмалын ордыг ашиглахдаа байгалийн баялаг ард түмний мэдэлд байх зарчимд нийцүүлэн түүний үр өгөөжийн дийлэнх нь ард түмэнд ногдож байх эрх зүйн үндсийг хуулиар тогтооно. Бэлчээр, нийтийн эдэлбэрийн ба улсын тусгай хэрэгцээнийхээс бусад газрыг зөвхөн Монгол Улсын иргэнд өмчлүүлж болно. Энэ нь газрын хэвлийг өмчлөхөд хамаарахгүй. Иргэд хувийн өмчийнхөө газрыг худалдах, арилжих, бэлэглэх, барьцаалах зэргээр гадаадын иргэн, харьяалалгүй хүний өмчлөлд шилжүүлэх, түүнчлэн төрийн эрх бүхий байгууллагын зөвшөөрөлгүйгээр бусдад эзэмшүүлэх, ашиглуулахыг хориглоно. Төр газрын эзэнд газартай нь холбогдсон үүрэг хүлээлгэх, улсын тусгай хэрэгцээг үндэслэн нөхөх олговортойгоор газрыг солих буюу эргүүлэн авах, уг газрыг хүн амын эрүүл мэнд, байгаль хамгаалал, үндэсний аюулгүй байдлын ашиг сонирхолд харшаар ашиглавал хураан авч болно. Төрөөс гадаадын иргэн, хуулийн этгээд, харьяалалгүй хүнд газрыг төлбөр, хугацаатайгаар болон хуульд заасан бусад болзол, журмаар ашиглуулж болно.", "provisions": [{"pid": "6.1", "kind": "declaration", "actor": "ард түмэн/төр", "summary": "Газар, хэвлий, ой, ус, амьтан, ургамал ард түмний мэдэл, төрийн хамгаалалтад", "delegates": false, "limits": null, "amended": []}, {"pid": "6.2", "kind": "declaration", "actor": "төр", "summary": "Хэвлийн баялгийн үр өгөөжийг Үндэсний баялгийн санд төвлөрүүлж тэгш, шударга хүртээх", "delegates": false, "limits": null, "amended": [2019]}, {"pid": "6.2.b", "kind": "right", "actor": "иргэн", "summary": "Олборлолтын байгаль орчны нөлөөллийг мэдэх эрх", "delegates": false, "limits": null, "amended": [2019]}, {"pid": "6.2.c", "kind": "delegation", "actor": "УИХ", "summary": "Стратегийн ордын үр өгөөжийн дийлэнх нь ард түмэнд ногдох эрх зүйн үндсийг хуулиар тогтооно", "delegates": true, "limits": null, "amended": [2019]}, {"pid": "6.3", "kind": "prohibition", "actor": "иргэн", "summary": "Бэлчээр, нийтийн эдэлбэрийн газрыг өмчлүүлэхгүй; гадаадад шилжүүлэхийг хориглоно", "delegates": false, "limits": null, "amended": []}, {"pid": "6.4", "kind": "power", "actor": "төр", "summary": "Тусгай хэрэгцээгээр нөхөх олговортой газар эргүүлэн авах, хураах", "delegates": false, "limits": null, "amended": []}, {"pid": "6.5", "kind": "delegation", "actor": "төр", "summary": "Гадаадын этгээдэд газар ашиглуулах журмыг хуулиар", "delegates": true, "limits": null, "amended": []}], "findings": [5, 13, 13, 37, 41, 43, 44, 44], "modality": {"descriptive": 5, "right": 1, "permission": 3, "prohibition": 1}}, {"number": "7", "chapter": 1, "title": "Түүх, соёл, оюуны өв", "text": "Монголын ард түмний түүх, соёлын дурсгалт зүйл, шинжлэх ухаан, оюуны өв төрийн хамгаалалтад байна. Иргэний туурвисан оюуны үнэт зүйл бол зохиогчийнх нь өмч, Монгол Улсын үндэсний баялаг мөн.", "provisions": [{"pid": "7.1", "kind": "declaration", "actor": "төр", "summary": "Түүх, соёл, шинжлэх ухаан, оюуны өв төрийн хамгаалалтад", "delegates": false, "limits": null, "amended": []}, {"pid": "7.2", "kind": "declaration", "actor": "", "summary": "Оюуны үнэт зүйл зохиогчийн өмч, үндэсний баялаг", "delegates": false, "limits": null, "amended": []}], "findings": [], "modality": {"descriptive": 2}}, {"number": "8", "chapter": 1, "title": "Төрийн хэл", "text": "Монгол хэл бол төрийн албан ёсны хэл мөн. Энэ зүйлийн 1 дэх хэсгийн заалт нь хүн амын өөр хэл бүхий үндэстний цөөнх эх хэлээрээ суралцах, харилцах, соёл, урлаг, шинжлэх ухааны үйл ажиллагаа явуулах эрхийг үл хөндөнө.", "provisions": [{"pid": "8.1", "kind": "declaration", "actor": "", "summary": "Монгол хэл төрийн албан ёсны хэл", "delegates": false, "limits": null, "amended": []}, {"pid": "8.2", "kind": "right", "actor": "үндэстний цөөнх", "summary": "Эх хэлээрээ суралцах, харилцах эрхийг үл хөндөнө", "delegates": false, "limits": null, "amended": []}], "findings": [], "modality": {"descriptive": 1, "prohibition": 1}}, {"number": "9", "chapter": 1, "title": "Төр ба шашин", "text": "Монгол Улсад төр нь шашнаа хүндэтгэж, шашин нь төрөө дээдэлнэ. Төрийн байгууллага шашны, сүм хийд улс төрийн үйл ажиллагаа эрхлэн явуулж болохгүй. Төр, сүм хийдийн хоорондын харилцааг хуулиар зохицуулна.", "provisions": [{"pid": "9.1", "kind": "declaration", "actor": "", "summary": "Төр шашнаа хүндэтгэж, шашин төрөө дээдэлнэ", "delegates": false, "limits": null, "amended": []}, {"pid": "9.2", "kind": "prohibition", "actor": "", "summary": "Төр шашны, сүм хийд улс төрийн үйл ажиллагаа явуулахгүй", "delegates": false, "limits": null, "amended": []}, {"pid": "9.3", "kind": "delegation", "actor": "УИХ", "summary": "Төр, сүм хийдийн харилцааг хуулиар", "delegates": true, "limits": null, "amended": []}], "findings": [13], "modality": {"right": 1, "prohibition": 1, "descriptive": 1}}, {"number": "10", "chapter": 1, "title": "Олон улсын эрх зүй", "text": "Монгол Улс олон улсын эрх зүйн нийтээр хүлээн зөвшөөрсөн хэм хэмжээ, зарчмыг баримталж энхийг эрхэмлэсэн гадаад бодлого явуулна. Монгол Улс олон улсын гэрээгээр хүлээсэн үүргээ шударгаар сахин биелүүлнэ. Монгол Улсын олон улсын гэрээ нь соёрхон баталсан буюу нэгдэн орсон тухай хууль хүчин төгөлдөр болмогц дотоодын хууль тогтоомжийн нэгэн адил үйлчилнэ. Монгол Улс Үндсэн хуульдаа харшилсан олон улсын гэрээ, бусад баримт бичгийг дагаж мөрдөхгүй.", "provisions": [{"pid": "10.1", "kind": "declaration", "actor": "", "summary": "Олон улсын эрх зүйн хэм хэмжээг баримтлах", "delegates": false, "limits": null, "amended": []}, {"pid": "10.2", "kind": "duty", "actor": "Монгол Улс", "summary": "Гэрээгээр хүлээсэн үүргээ биелүүлнэ", "delegates": false, "limits": null, "amended": []}, {"pid": "10.3", "kind": "declaration", "actor": "", "summary": "Соёрхон баталсан гэрээ дотоодын хууль тогтоомжийн нэгэн адил", "delegates": false, "limits": null, "amended": []}, {"pid": "10.4", "kind": "prohibition", "actor": "", "summary": "Үндсэн хуульд харшилсан гэрээг дагахгүй", "delegates": false, "limits": null, "amended": []}], "findings": [26], "modality": {"descriptive": 3, "prohibition": 1}}, {"number": "11", "chapter": 1, "title": "Батлан хамгаалах", "text": "Эх орныхоо тусгаар тогтнолыг батлан хамгаалж, үндэсний аюулгүй байдал, нийгмийн дэг журмыг хангах нь төрийн үүрэг мөн. Монгол Улс өөрийгөө хамгаалах зэвсэгт хүчинтэй байна. Зэвсэгт хүчний бүтэц, зохион байгуулалт, түүнд алба хаах журмыг хуулиар тогтооно.", "provisions": [{"pid": "11.1", "kind": "duty", "actor": "төр", "summary": "Тусгаар тогтнол, аюулгүй байдал, дэг журам хангах", "delegates": false, "limits": null, "amended": []}, {"pid": "11.2", "kind": "delegation", "actor": "УИХ", "summary": "Зэвсэгт хүчний бүтэц, алба хаах журмыг хуулиар", "delegates": true, "limits": null, "amended": []}], "findings": [13], "modality": {"descriptive": 3}}, {"number": "12", "chapter": 1, "title": "Төрийн бэлгэ тэмдэг", "text": "Монгол Улсын тусгаар тогтнол, бүрэн эрхт байдлын бэлгэ тэмдэг нь Төрийн сүлд, туг, далбаа, тамга, дуулал мөн. Төрийн сүлд, туг, далбаа, дуулал нь Монголын ард түмний түүхэн уламжлал, хүсэл тэмүүлэл, эв нэгдэл, шударга ёс, цог хийморийг илэрхийлнэ. Төрийн сүлд нь ариун цагаан өнгийн бадам цэцэг суурьтай, төгсгөлгүй үргэлжлэн дэлгэрэх түмэн насан хээгээр хөвөөлсөн, мөнх тэнгэрийг бэлгэдсэн дугариг хөх дэвсгэртэй байна. Сүлдний төв хэсэгт Монгол Улсын тусгаар тогтнол, бүрэн эрхт байдал, цог хийморийг илтгэсэн алтан соёмбо, эрдэнийн хүлгийг хослуулан дүрсэлсэн байна. Сүлдний хүрээний магнайн хэсэгт эрт, эдүгээ, ирээдүй гурван цагийг бэлгэдсэн хүслийг хангагч чандмань эрдэнэ, доод хэсэгт эх газрыг төлөөлсөн ногоон өнгийн уулан хээ, ашид дэвжихийн өлзий хутаг оршсон хүрдийг тус тус дүрсэлнэ. Хүрдийг хадгаар дээдлэн сүлжсэн байна. Монголын нэгдсэн тулгар төрийн уламжлалт Их цагаан туг нь Монгол Улсын төрийн хүндэтгэлийн бэлгэдэл мөн. Монгол Улсын төрийн далбаа нь улаан, хөх, улаан хосолсон өнгөтэй байна. Далбааны гурав хуваасны нэгийн хэмжээтэй дундах хэсэг нь мөнх тэнгэрийн хөх, түүний хоёр тал нь мандан бадрахын бэлгэдэл улаан өнгөтэй байна. Далбааны ишин талын улаан дэвсгэрийн төв хэсэгт алтан соёмбо байрлуулна. Далбааны өргөн, урт нь 1:2-ын харьцаатай байна. Төрийн тамга дөрвөлжин хэлбэртэй, голдоо төрийн сүлдтэй, сүлдний хоёр талаар Монгол Улс гэсэн бичээстэй, арслангийн дүрс бүхий бариултай байна. Төрийн тамгыг Монгол Улсын Ерөнхийлөгч барина. Төрийн бэлгэ тэмдгийг дээдлэн хэрэглэх журам, төрийн дууллын үг, аяыг хуулиар бататгана.", "provisions": [{"pid": "12.1", "kind": "declaration", "actor": "", "summary": "Сүлд, туг, далбаа, тамга, дуулал", "delegates": false, "limits": null, "amended": []}, {"pid": "12.6", "kind": "power", "actor": "Ерөнхийлөгч", "summary": "Төрийн тамгыг барина", "delegates": false, "limits": null, "amended": []}, {"pid": "12.7", "kind": "delegation", "actor": "УИХ", "summary": "Бэлгэ тэмдэг хэрэглэх журам, дууллыг хуулиар", "delegates": true, "limits": null, "amended": []}], "findings": [13], "modality": {"descriptive": 14}}, {"number": "13", "chapter": 1, "title": "Нийслэл", "text": "Монгол Улсын төрийн дээд байгууллагууд байнга оршдог хотыг Улсын нийслэл гэнэ. Монгол Улсын нийслэл Улаанбаатар хот мөн. Монгол Улсын нийслэлийн эрх зүйн үндсийг хуулиар тогтооно.", "provisions": [{"pid": "13.1", "kind": "declaration", "actor": "", "summary": "Нийслэл Улаанбаатар", "delegates": false, "limits": null, "amended": []}, {"pid": "13.2", "kind": "delegation", "actor": "УИХ", "summary": "Нийслэлийн эрх зүйн үндсийг хуулиар", "delegates": true, "limits": null, "amended": []}], "findings": [13], "modality": {"descriptive": 3}}, {"number": "14", "chapter": 2, "title": "Эрх тэгш байдал", "text": "Монгол Улсад хууль ёсоор оршин суугаа хүн бүр хууль, шүүхийн өмнө эрх тэгш байна. Хүнийг үндэс, угсаа, хэл, арьсны өнгө, нас, хүйс, нийгмийн гарал, байдал, хөрөнгө чинээ, эрхэлсэн ажил, албан тушаал, шашин шүтлэг, үзэл бодол, боловсролоор нь ялгаварлан гадуурхаж үл болно. Хүн бүр эрх зүйн этгээд байна.", "provisions": [{"pid": "14.1", "kind": "right", "actor": "хууль ёсоор оршин суугаа хүн", "summary": "Хууль, шүүхийн өмнө эрх тэгш", "delegates": false, "limits": null, "amended": []}, {"pid": "14.2", "kind": "prohibition", "actor": "", "summary": "Үндэс, угсаа, хэл, ... боловсролоор ялгаварлахгүй (хөгжлийн бэрхшээл жагсаалтад алга)", "delegates": false, "limits": null, "amended": []}], "findings": [56], "modality": {"descriptive": 2, "prohibition": 1}}, {"number": "15", "chapter": 2, "title": "Иргэний харьяалал", "text": "Монгол Улсын иргэний харьяалал хийгээд харьяат болох, харьяатаас гарах үндэслэл, журмыг гагцхүү хуулиар тогтооно. Монгол Улсын иргэнийг харьяатаас хасах, эх орноосоо хөөх, өөр улсад шилжүүлэн өгөхийг хориглоно.", "provisions": [{"pid": "15.1", "kind": "delegation", "actor": "УИХ", "summary": "Харьяаллын үндэслэл, журмыг гагцхүү хуулиар", "delegates": true, "limits": null, "amended": []}, {"pid": "15.2", "kind": "prohibition", "actor": "", "summary": "Харьяатаас хасах, хөөх, шилжүүлэн өгөхийг хориглоно", "delegates": false, "limits": null, "amended": []}], "findings": [6, 13], "modality": {"permission": 1, "prohibition": 1}}, {"number": "16", "chapter": 2, "title": "Үндсэн эрх, эрх чөлөө", "text": "Монгол Улсын иргэн дараахь үндсэн эрх, эрх чөлөөг баталгаатай эдэлнэ: Монгол Улсын иргэн дараахь үндсэн эрх, эрх чөлөөг баталгаатай эдэлнэ: амьд явах эрхтэй. Монгол Улсын Эрүүгийн хуульд заасан онц хүнд гэмт хэрэг үйлдсэний учир шүүхийн хүчин төгөлдөр тогтоолоор ялын дээд хэмжээ оногдуулснаас бусад тохиолдолд хүний амь нас бусниулахыг хатуу хориглоно; эрүүл, аюулгүй орчинд амьдрах, орчны бохирдол, байгалийн тэнцэл алдагдахаас хамгаалуулах эрхтэй; хөдлөх, үл хөдлөх хөрөнгө шударгаар олж авах, эзэмших, өмчлөх, өв залгамжлуулах эрхтэй. Хувийн өмчийг хууль бусаар хураах, дайчлан авахыг хориглоно. Төр, түүний эрх бүхий байгууллага нь нийгмийн зайлшгүй хэрэгцээг үндэслэн хувийн өмчийн эд хөрөнгийг дайчлан авбал нөхөх олговор, үнийг төлнө; ажил мэргэжлээ чөлөөтэй сонгох, хөдөлмөрийн аятай нөхцөлөөр хангуулах, цалин хөлс авах, амрах, хувийн аж ахуй эрхлэх эрхтэй. Хэнийг ч хууль бусаар албадан хөдөлмөрлүүлж болохгүй; өндөр наслах, хөдөлмөрийн чадвар алдах, хүүхэд төрүүлэх, асрах болон хуульд заасан бусад тохиолдолд эд, мөнгөний тусламж авах эрхтэй; эрүүл мэндээ хамгаалуулах, эмнэлгийн тусламж авах эрхтэй. Иргэдэд эмнэлгийн төлбөргүй тусламж үзүүлэх болзол, журмыг хуулиар тогтооно; сурч боловсрох эрхтэй. Төрөөс бүх нийтийн ерөнхий боловсролыг төлбөргүй олгоно. Иргэд төрөөс тавих шаардлагад нийцсэн хувийн сургууль байгуулан ажиллуулж болно; соёл, урлаг, шинжлэх ухааны үйл ажиллагаа явуулах, бүтээл туурвих, үр шимийг нь хүртэх эрхтэй. Зохиогч, шинэ бүтээл, нээлтийн эрхийг хуулиар хамгаална; шууд буюу төлөөлөгчдийн байгууллагаараа уламжлан төрийг удирдах хэрэгт оролцох эрхтэй. Төрийн байгууллагад сонгох, сонгогдох эрхтэй. Сонгох эрхийг арван найман наснаас эдэлнэ. Сонгогдох насыг төрийн зохих байгууллага, албан тушаалд тавих шаардлагыг харгалзан хуулиар тогтооно; нийгмийн болон өөрсдийн ашиг сонирхол, үзэл бодлын үүднээс нам, олон нийтийн бусад байгууллага байгуулах, сайн дураараа эвлэлдэн нэгдэх эрхтэй. Нам, олон нийтийн бусад бүх байгууллага нийгэм, төрийн аюулгүй байдлыг сахиж, хуулийг дээдлэн биелүүлнэ. Аль нэгэн нам, олон нийтийн бусад байгууллагад эвлэлдэн нэгдсэний төлөө болон гишүүний нь хувьд хүнийг ялгаварлан гадуурхах, хэлмэгдүүлэхийг хориглоно. Төрийн зарим төрлийн албан хаагчийн намын гишүүнийг түдгэлзүүлж болно; улс төр, эдийн засаг, нийгэм соёлын амьдрал, гэр бүлийн харилцаанд эрэгтэй, эмэгтэй тэгш эрхтэй. Гэрлэлт нь хуулиар тогтоосон насанд хүрсэн эрэгтэй, эмэгтэй хоёрын тэгш эрх, сайн дурын харилцаанд үндэслэнэ. Гэр бүл, эх нялхас, хүүхдийн ашиг сонирхлыг төр хамгаална; төрийн байгууллага, албан тушаалтанд өргөдөл, гомдлоо гаргаж шийдвэрлүүлэх эрхтэй. Төрийн байгууллага, албан тушаалтан нь иргэдийн өргөдөл, гомдлыг хуулийн дагуу шийдвэрлэх үүрэгтэй; халдашгүй, чөлөөтэй байх эрхтэй. Хуульд заасан үндэслэл, журмаас гадуур дур мэдэн хэнийг ч нэгжих, баривчлах, хорих, мөрдөн мөшгих, эрх чөлөөг нь хязгаарлахыг хориглоно. Хэнд боловч эрүү шүүлт тулгаж, хүнлэг бус, хэрцгий хандаж, нэр төрийг нь доромжилж болохгүй. Баривчилсан шалтгаан, үндэслэлийг баривчлагдсан хүн, түүний гэр бүлийнхэн, өмгөөлөгчид нь хуульд заасан хугацаанд мэдэгдэнэ. Иргэний хувийн ба гэр бүл, захидал харилцааны нууц, орон байрны халдашгүй байдлыг хуулиар хамгаална; Монгол Улсын хууль, олон улсын гэрээнд заасан эрх, эрх чөлөө нь зөрчигдсөн гэж үзвэл уул эрхээ хамгаалуулахаар шүүхэд гомдол гаргах, бусдын хууль бусаар учруулсан хохирлыг нөхөн төлүүлэх, өөрийн болон гэр бүлийн гишүүд, эцэг эх, үр хүүхдийнхээ эсрэг мэдүүлэг өгөхгүй байх, өөрийгөө өмгөөлөх, хууль зүйн туслалцаа авах, нотлох баримтыг шалгуулах, шударга шүүхээр шүүлгэх, хэргээ шүүх ажиллагаанд биеэр оролцох, шүүхийн шийдвэрийг давж заалдах, уучлал хүсэх эрхтэй. Өөрөө өөрийнхөө эсрэг мэдүүлэг өгөхийг шаардах, мэдүүлэг гаргуулахаар шахалт үзүүлэх, хүч хэрэглэхийг хориглоно. Гэм буруутай нь хуулийн дагуу шүүхээр нотлогдох хүртэл хэнийг ч гэмт хэрэг үйлдсэн гэм буруутайд тооцож үл болно. Гэм буруутны ял зэмлэлийг түүний гэр бүлийн гишүүд, төрөл саданд нь халдаан хэрэглэхийг хориглоно; шашин шүтэх, эс шүтэх эрх чөлөөтэй; итгэл үнэмшилтэй байх, үзэл бодлоо чөлөөтэй илэрхийлэх, үг хэлэх, хэвлэн нийтлэх, тайван жагсаал, цуглаан хийх эрх чөлөөтэй. Жагсаал, цуглаан хийх журмыг хуулиар тогтооно; төр, түүний байгууллагаас хууль ёсоор тусгайлан хамгаалбал зохих нууцад хамаарахгүй асуудлаар мэдээлэл хайх, хүлээн авах эрхтэй. Хүний эрх, нэр төр, алдар хүнд, улсыг батлан хамгаалах, үндэсний аюулгүй байдал, нийгмийн хэв журмыг хангах зорилгоор задруулж үл болох төр, байгууллага, хувь хүний нууцыг хуулиар тогтоон хамгаална; улсынхаа нутаг дэвсгэрт чөлөөтэй зорчих, түр буюу байнга оршин суух газраа сонгох, гадаадад явах, оршин суух, эх орондоо буцаж ирэх эрхтэй. Гадаадад явах, оршин суух эрхийг үндэсний болон хүн амын аюулгүй байдлыг хангах, нийгмийн хэв журмыг хамгаалахын тулд зөвхөн хуулиар хязгаарлаж болно.", "provisions": [{"pid": "16.1", "kind": "right", "actor": "иргэн", "summary": "Амьд явах эрх; ялын дээд хэмжээгээр бусниулахыг ЗӨВШӨӨРСӨН хэвээр", "delegates": false, "limits": null, "amended": []}, {"pid": "16.2", "kind": "right", "actor": "иргэн", "summary": "Эрүүл, аюулгүй орчинд амьдрах эрх", "delegates": false, "limits": null, "amended": []}, {"pid": "16.3", "kind": "right", "actor": "иргэн", "summary": "Өмчлөх эрх; дайчлан авбал нөхөх олговор", "delegates": false, "limits": null, "amended": []}, {"pid": "16.4", "kind": "right", "actor": "иргэн", "summary": "Ажил сонгох, аятай нөхцөл, цалин", "delegates": false, "limits": null, "amended": []}, {"pid": "16.5", "kind": "right", "actor": "иргэн", "summary": "Нас, хөдөлмөрийн чадвар алдах үед тусламж авах", "delegates": true, "limits": null, "amended": []}, {"pid": "16.6", "kind": "right", "actor": "иргэн", "summary": "Эрүүл мэнд; төлбөргүй тусламжийн журмыг хуулиар", "delegates": true, "limits": null, "amended": []}, {"pid": "16.7", "kind": "right", "actor": "иргэн", "summary": "Боловсрол; ерөнхий боловсрол төлбөргүй", "delegates": false, "limits": null, "amended": []}, {"pid": "16.8", "kind": "right", "actor": "иргэн", "summary": "Соёл, шинжлэх ухааны бүтээл", "delegates": true, "limits": null, "amended": []}, {"pid": "16.9", "kind": "right", "actor": "иргэн", "summary": "Сонгох (18 нас), сонгогдох (насыг хуулиар)", "delegates": true, "limits": null, "amended": []}, {"pid": "16.10", "kind": "right", "actor": "иргэн", "summary": "Нам, байгууллага байгуулах, эвлэлдэн нэгдэх", "delegates": false, "limits": null, "amended": []}, {"pid": "16.11", "kind": "right", "actor": "иргэн", "summary": "Эрэгтэй, эмэгтэй тэгш эрх", "delegates": false, "limits": null, "amended": []}, {"pid": "16.12", "kind": "right", "actor": "иргэн", "summary": "Өргөдөл, гомдол гаргах; байгууллага хуулийн дагуу шийдвэрлэх үүрэгтэй", "delegates": false, "limits": null, "amended": []}, {"pid": "16.13", "kind": "right", "actor": "иргэн", "summary": "Халдашгүй, чөлөөтэй байх; эрүү шүүлт хориг; хувийн нууцыг хуулиар хамгаална", "delegates": true, "limits": null, "amended": []}, {"pid": "16.14", "kind": "right", "actor": "иргэн", "summary": "Шүүхэд гомдол гаргах, шударга шүүх, гэм буруугүйд тооцох", "delegates": false, "limits": null, "amended": []}, {"pid": "16.15", "kind": "right", "actor": "иргэн", "summary": "Шашин шүтэх, эс шүтэх", "delegates": false, "limits": null, "amended": []}, {"pid": "16.16", "kind": "right", "actor": "иргэн", "summary": "Үзэл бодол, хэвлэл, жагсаал; жагсаалын журмыг хуулиар", "delegates": true, "limits": null, "amended": []}, {"pid": "16.17", "kind": "right", "actor": "иргэн", "summary": "Мэдээлэл хайх, хүлээн авах; нууцыг хуулиар тогтооно", "delegates": true, "limits": "хүний эрх, батлан хамгаалах, аюулгүй байдал, хэв журмын зорилго", "amended": []}, {"pid": "16.18", "kind": "right", "actor": "иргэн", "summary": "Зорчих, гадаадад явах; зөвхөн хуулиар хязгаарлана", "delegates": true, "limits": "үндэсний/хүн амын аюулгүй байдал, хэв журам", "amended": []}], "findings": [5, 6, 6, 6, 6, 6, 6, 13, 13, 13, 13, 13, 13, 26, 27, 42], "modality": {"right": 22, "prohibition": 9, "obligation": 2, "descriptive": 10, "permission": 4}}, {"number": "17", "chapter": 2, "title": "Иргэний үүрэг", "text": "Монгол Улсын иргэн шударга, хүнлэг ёсыг эрхэмлэн дараахь үндсэн үүргийг ёсчлон биелүүлнэ: 1/Үндсэн хууль, бусад хуулийг дээдлэн хүндэтгэж, сахин биелүүлэх; 2/хүний нэр төр, алдар хүнд, эрх, хууль ёсны ашиг сонирхлыг хүндэтгэх; 3/хуулиар ногдуулсан албан татвар төлөх; 4/эх орноо хамгаалах, хуулийн дагуу цэргийн алба хаах. Хөдөлмөрлөх, эрүүл мэндээ хамгаалах, үр хүүхдээ өсгөн хүмүүжүүлэх, байгаль орчноо хамгаалах нь иргэн бүрийн журамт үүрэг мөн.", "provisions": [{"pid": "17.1", "kind": "duty", "actor": "иргэн", "summary": "Хууль сахих, татвар төлөх, цэргийн алба хаах", "delegates": false, "limits": null, "amended": []}, {"pid": "17.2", "kind": "duty", "actor": "иргэн", "summary": "Хөдөлмөрлөх, байгаль хамгаалах журамт үүрэг", "delegates": false, "limits": null, "amended": []}], "findings": [], "modality": {"descriptive": 5, "soft": 1}}, {"number": "18", "chapter": 2, "title": "Гадаадын иргэн", "text": "Монгол Улсын нутаг дэвсгэрт байгаа гадаадын иргэний эрх, үүргийг Монгол Улсын хууль, уул иргэнийг харьяалсан улстай байгуулсан гэрээгээр тогтооно. Монгол Улс олон улсын гэрээгээр гадаадын иргэний эрх, үүргийг тодорхойлохдоо уул иргэнийг харьяалсан улстай энэ талаар харилцан адил байх зарчим баримтална. Монгол Улс нутаг дэвсгэртээ байгаа харьяалалгүй хүний эрх, үүргийг өөрийн хуулиар тогтооно. Үзэл бодол, улс төрийн хийгээд шударга ёсны бусад үйл ажиллагааныхаа улмаас хавчигдан мөшгөгдсөн гадаадын иргэн, харьяалалгүй хүн үндэслэл бүхий хүсэлт гаргавал Монгол Улсад орогнох эрх олгож болно. Үндсэн хуулийн арван зургадугаар зүйлд заасан Монгол Улсын иргэний үндсэн эрх, эрх чөлөөг тус улсын нутаг дэвсгэрт байгаа гадаадын иргэн, харьяалалгүй хүнд эдлүүлэхдээ Монгол Улсын нэгдэн орсон олон улсын гэрээнд заасан хүний салшгүй эрхээс бусад эрхийн хувьд үндэсний болон хүн амын аюулгүй байдлыг хангах, нийгмийн хэв журмыг хамгаалахын тулд хуулиар зохих хязгаарлал тогтоож болно.", "provisions": [{"pid": "18.1", "kind": "delegation", "actor": "УИХ", "summary": "Гадаадын иргэний эрх, үүргийг хууль, гэрээгээр", "delegates": true, "limits": null, "amended": []}, {"pid": "18.5", "kind": "delegation", "actor": "УИХ", "summary": "Гадаадын иргэний эрхийг хуулиар хязгаарлаж болно", "delegates": true, "limits": "салшгүй эрхээс бусад; аюулгүй байдал, хэв журам", "amended": []}], "findings": [6, 13], "modality": {"descriptive": 3, "permission": 2}}, {"number": "19", "chapter": 2, "title": "Төрийн хариуцлага, онц байдал", "text": "Төрөөс хүний эрх, эрх чөлөөг хангахуйц эдийн засаг, нийгэм, хууль зүйн болон бусад баталгааг бүрдүүлэх, хүний эрх, эрх чөлөөг зөрчихтэй тэмцэх, хөндөгдсөн эрхийг сэргээн эдлүүлэх үүргийг иргэнийхээ өмнө хариуцна. Онц болон дайны байдал зарласан тохиолдолд Үндсэн хууль, бусад хуульд заасан хүний эрх, эрх чөлөөг гагцхүү хуулиар хязгаарлаж болно. Тийнхүү хязгаарласан хууль нь хүний амьд явах эрх, итгэл үнэмшилтэй байх, шашин шүтэх, эс шүтэх эрх чөлөө, түүнчлэн хэнд боловч эрүү шүүлт тулгах, хүнлэг бус, хэрцгий хандахыг хориглосон хуулийн заалтыг үл хөндөнө. Хүн эрх, эрх чөлөөгөө эдлэхдээ үндэсний аюулгүй байдал, бусад хүний эрх, эрх чөлөөг хохироож, нийгмийн хэв журмыг гажуудуулж болохгүй.", "provisions": [{"pid": "19.1", "kind": "duty", "actor": "төр", "summary": "Хүний эрхийн баталгааг бүрдүүлэх, зөрчлийг сэргээх үүргийг хариуцна", "delegates": false, "limits": null, "amended": []}, {"pid": "19.2", "kind": "delegation", "actor": "УИХ", "summary": "Онц/дайны байдлын үед эрхийг гагцхүү хуулиар хязгаарлах; амь, итгэл, шашин, эрүү шүүлтийг үл хөндөнө", "delegates": true, "limits": "хөндөгдөхгүй 4 эрх; хугацаа, пропорциональ шалгуургүй", "amended": []}, {"pid": "19.3", "kind": "prohibition", "actor": "хүн", "summary": "Эрхээ эдлэхдээ аюулгүй байдал, бусдын эрхийг хохироохгүй", "delegates": false, "limits": null, "amended": []}], "findings": [30], "modality": {"obligation": 1, "permission": 1, "prohibition": 2}}, {"number": "19¹", "chapter": 2, "title": "Улс төрийн нам", "text": "Нам Үндсэн хуулийн арван зургадугаар зүйлийн 10-т заасны дагуу байгуулагдаж, улсын хэмжээний бодлого дэвшүүлж ажиллана. Намыг Монгол Улсын сонгуулийн эрх бүхий иргэдийн нэг хувиас доошгүй тооны иргэн эвлэлдэн нэгдэж байгуулна. Намын дотоод зохион байгуулалт ардчилсан зарчимд нийцсэн, хөрөнгө, орлогын эх үүсвэр, зарцуулалт нь нийтэд ил тод байна. Намын зохион байгуулалт, үйл ажиллагааны журам, санхүүжилт, төрөөс санхүүгийн дэмжлэг үзүүлэх нөхцөлийг хуулиар тогтооно.", "provisions": [{"pid": "19¹.1", "kind": "declaration", "actor": "нам", "summary": "Нам улсын хэмжээний бодлого дэвшүүлнэ", "delegates": false, "limits": null, "amended": [2019]}, {"pid": "19¹.2", "kind": "declaration", "actor": "", "summary": "Сонгогчдын 1%-иас доошгүй иргэн нам байгуулна (2028-01-01-ээс)", "delegates": false, "limits": null, "amended": [2019]}, {"pid": "19¹.3", "kind": "delegation", "actor": "УИХ", "summary": "Намын дотоод ардчилал, санхүүгийн ил тод байдал; журмыг хуулиар", "delegates": true, "limits": "ардчилсан зарчим, ил тод байдал", "amended": [2019]}], "findings": [], "modality": {"descriptive": 4}}, {"number": "20", "chapter": 3, "title": "УИХ — төрийн эрх барих дээд байгууллага", "text": "Монгол Улсын Их Хурал бол төрийн эрх барих дээд байгууллага мөн бөгөөд хууль тогтоох эрх мэдлийг гагцхүү Улсын Их Хуралд хадгална.", "provisions": [{"pid": "20", "kind": "declaration", "actor": "УИХ", "summary": "Хууль тогтоох эрх гагцхүү УИХ-д", "delegates": false, "limits": null, "amended": []}], "findings": [], "modality": {"descriptive": 1}}, {"number": "21", "chapter": 3, "title": "УИХ-ын бүрэлдэхүүн, сонгууль", "text": "Улсын Их Хурал нэг танхимтай, нэг зуун хорин зургаан гишүүнтэй байна. Улсын Их Хурлын сонгуулийг сонгуулийн холимог тогтолцоогоор явуулна. Улсын Их Хурлын далан найман гишүүнийг олныг төлөөлөх, дөчин найман гишүүнийг хувь тэнцүүлэн төлөөлөх аргаар сонгоно. Улсын Их Хурлын гишүүнийг Монгол Улсын сонгуулийн эрх бүхий иргэд нийтээрээ, чөлөөтэй, шууд сонгох эрхийн үндсэн дээр саналаа нууцаар гаргаж, дөрвөн жилийн хугацаагаар сонгоно. Улсын Их Хурлын гишүүнээр Монгол Улсын хорин таван нас хүрсэн, сонгуулийн эрх бүхий иргэнийг сонгоно. Улсын Их Хурлын сонгуулийн журмыг хуулиар тогтооно. Улсын Их Хурлын ээлжит сонгууль явуулахын өмнөх нэг жилийн дотор Улсын Их Хурлын сонгуулийн тухай хууль батлах, түүнд нэмэлт, өөрчлөлт оруулахыг хориглоно.", "provisions": [{"pid": "21.1", "kind": "declaration", "actor": "УИХ", "summary": "Нэг танхимтай, 126 гишүүнтэй (78 мажоритар, 48 пропорциональ)", "delegates": false, "limits": null, "amended": [2023]}, {"pid": "21.2", "kind": "declaration", "actor": "сонгогч", "summary": "4 жилийн хугацаагаар шууд, нууц сонгоно", "delegates": false, "limits": null, "amended": []}, {"pid": "21.4", "kind": "prohibition", "actor": "УИХ", "summary": "Ээлжит сонгуулийн өмнөх 1 жилд сонгуулийн хууль өөрчлөхийг хориглоно", "delegates": true, "limits": "1 жилийн хөлдөөлт (зөвхөн ээлжит сонгууль)", "amended": [2019]}], "findings": [1, 1, 8], "modality": {"descriptive": 6, "prohibition": 1}}, {"number": "22", "chapter": 3, "title": "Бүрэн эрх сунгах, тарах", "text": "Улсын нийт нутаг дэвсгэр буюу зарим хэсгийг нь хамарсан гэнэтийн аюул тохиолдсон, дайны ба нийтийн эмх замбараагүй байдал үүссэн зэрэг онцгой нөхцөлийн улмаас ээлжит сонгууль явуулах боломжгүй бол мөнхүү нөхцөл арилж, шинэ сонгогдсон гишүүдээ тангараг өргөтөл Улсын Их Хурал бүрэн эрхээ хэрэгжүүлнэ. Улсын Их Хурал бүрэн эрхээ хэрэгжүүлэх боломжгүй гэж нийт гишүүний гуравны хоёроос доошгүй нь үзэж, эсхүл мөнхүү шалтгаанаар Ерөнхийлөгч Улсын Их Хурлын даргатай зөвшилцөж санал болгосон бол Улсын Их Хурлын нийт гишүүний гуравны хоёроос доошгүйн саналаар өөрөө тарах шийдвэр гаргаж болно. Ерөнхийлөгч Үндсэн хуулийн гучин есдүгээр зүйлийн 2 дахь хэсэгт заасны дагуу Ерөнхий сайдыг томилох саналыг Улсын Их Хуралд анх оруулснаас хойш дөчин тав хоногийн дотор, эсхүл Үндсэн хуулийн дөчин гуравдугаар зүйлийн 1 дэх хэсэгт заасны дагуу Ерөнхий сайдыг огцруулснаас, түүнчлэн дөчин дөрөвдүгээр зүйлийн 2 дахь хэсэгт заасны дагуу Ерөнхий сайдыг огцорсонд тооцсоноос хойш гуч хоногийн дотор Улсын Их Хурал Ерөнхий сайдыг томилоогүй бол Ерөнхийлөгч Улсын Их Хурлыг тараах шийдвэр гаргана. Энэ зүйлийн 2, эсхүл 3 дахь хэсэгт заасны дагуу шийдвэр гаргаснаас хойш Улсын Их Хурал арав хоногийн дотор сонгуулийг товлон зарлаж, жар хоногийн дотор явуулна. Шинэ сонгогдсон гишүүд тангараг өргөтөл Улсын Их Хурал бүрэн эрхээ хадгална.", "provisions": [{"pid": "22.1", "kind": "procedure", "actor": "УИХ", "summary": "Онцгой нөхцөлд сонгууль явуулах боломжгүй бол нөхцөл арилтал бүрэн эрхээ хэрэгжүүлнэ", "delegates": false, "limits": null, "amended": []}, {"pid": "22.2", "kind": "procedure", "actor": "УИХ", "summary": "Нийт гишүүний 2/3-оор өөрөө тарах", "delegates": false, "limits": null, "amended": [2000, 2019]}, {"pid": "22.3", "kind": "procedure", "actor": "Ерөнхийлөгч", "summary": "45/30 хоногт Ерөнхий сайд томилоогүй бол УИХ-ыг тараах шийдвэр гаргана", "delegates": false, "limits": null, "amended": [2019]}, {"pid": "22.4", "kind": "procedure", "actor": "УИХ", "summary": "Тарах шийдвэрээс 10 хоногт сонгууль зарлаж, 60 хоногт явуулна", "delegates": false, "limits": null, "amended": [2019]}], "findings": [1, 7, 8, 10, 60], "modality": {"descriptive": 4, "permission": 1}}, {"number": "23", "chapter": 3, "title": "УИХ-ын гишүүн", "text": "Улсын Их Хурлын гишүүн бол ард түмний элч мөн бөгөөд нийт иргэн, улсын ашиг сонирхлыг эрхэмлэн баримтална. Улсын Их Хурлын гишүүний бүрэн эрх нь Төрийн сүлдэндээ тангараг өргөснөөр эхэлж, Улсын Их Хурлын дараагийн сонгуулиар шинэ сонгогдсон гишүүд тангараг өргөснөөр дуусгавар болно.", "provisions": [{"pid": "23.1", "kind": "declaration", "actor": "УИХ-ын гишүүн", "summary": "Ард түмний элч", "delegates": false, "limits": null, "amended": []}, {"pid": "23.2", "kind": "declaration", "actor": "", "summary": "Бүрэн эрх тангаргаас шинэ гишүүдийн тангараг хүртэл", "delegates": false, "limits": null, "amended": []}], "findings": [], "modality": {"descriptive": 1, "permission": 1}}, {"number": "24", "chapter": 3, "title": "УИХ-ын дарга", "text": "Улсын Их Хурлын дарга, дэд даргыг Улсын Их Хурлын гишүүдийн дотроос нэр дэвшүүлэн саналаа илээр гаргаж сонгоно. Улсын Их Хурлын тухайн сонгуулийн дүнд бий болсон нам, эвслийн бүлэг тус бүрээс Улсын Их Хурлын дэд даргыг сонгоно. Улсын Их Хурлын дарга, дэд даргын бүрэн эрхийн хугацаа дөрвөн жил байх бөгөөд хуульд заасан үндэслэлээр хугацаанаас нь өмнө чөлөөлж, огцруулж болно.", "provisions": [{"pid": "24.1", "kind": "procedure", "actor": "УИХ", "summary": "Дарга, дэд даргыг илээр сонгоно", "delegates": false, "limits": null, "amended": [1999, 2000]}, {"pid": "24.2", "kind": "delegation", "actor": "УИХ", "summary": "4 жил; хуульд заасан үндэслэлээр огцруулж болно", "delegates": true, "limits": null, "amended": []}], "findings": [13], "modality": {"descriptive": 2, "permission": 1}}, {"number": "25", "chapter": 3, "title": "УИХ-ын онцгой бүрэн эрх", "text": "Улсын Их Хурал төрийн дотоод, гадаад бодлогын аль ч асуудлыг санаачлан хэлэлцэж болох бөгөөд дараахь асуудлыг өөрийн онцгой бүрэн эрхэд хадгалж шийдвэрлэнэ: хууль батлах, нэмэлт, өөрчлөлт оруулах; төрийн дотоод, гадаад бодлогын үндсийг тодорхойлох; Ерөнхийлөгчийн ба Улсын Их Хурал, түүний гишүүний сонгуулийг товлон зарлах; Улсын Их Хурлын Байнгын хороо, Засгийн газар, хуульд зааснаар Улсын Их Хуралд ажлаа шууд хариуцан тайлагнадаг бусад байгууллагын бүтэц, бүрэлдэхүүнийг тогтоох, өөрчлөх; Ерөнхийлөгчийг сонгогдсон гэж үзэж бүрэн эрхийг нь хүлээн зөвшөөрсөн хууль гаргах, чөлөөлөх, огцруулах; Ерөнхий сайд, хуульд зааснаар Улсын Их Хуралд ажлаа шууд хариуцан тайлагнадаг бусад байгууллагын бүрэлдэхүүнийг томилох, өөрчлөх, огцруулах; төрийн санхүү, зээл, албан татвар, мөнгөний бодлого, улсын эдийн засаг, нийгмийн хөгжлийн бодлого, үндсэн чиглэлийг тодорхойлж, хөгжлийн болон үндэсний аюулгүй байдлын бодлогод нийцүүлэн боловсруулсан Засгийн газрын үйл ажиллагааны хөтөлбөр, улсын төсөв, түүний гүйцэтгэлийн тайланг батлах; Хөгжлийн бодлого, төлөвлөлт тогтвортой байна. Улсын төсвийг хэлэлцэн батлахдаа төсвийн орлого, зарлагын бүтцийг өөрчилж болно. Ингэхдээ Засгийн газрын өргөн мэдүүлсэн төсвийн зарлагын болон алдагдлын хэмжээг нэмэгдүүлж үл болно. Төрийн санхүү, төсвийн хяналтыг хараат бусаар хэрэгжүүлэх байгууллагын бүрэн эрх, зохион байгуулалт, үйл ажиллагааны журмыг хуулиар тогтооно; хууль, Улсын Их Хурлын бусад шийдвэрийн биелэлтийг хянан шалгах; улсын хил тогтоох; Монгол Улсын үндэсний аюулгүй байдлын зөвлөлийн бүтэц, бүрэлдэхүүн, бүрэн эрхийг тогтоох; Засгийн газрын өргөн мэдүүлснээр Монгол Улсын засаг захиргаа, нутаг дэвсгэрийн хуваарийг батлах, өөрчлөх; нутгийн өөрөө удирдах болон захиргааны байгууллагын тогтолцоо, зохион байгуулалт, үйл ажиллагааны эрх зүйн үндсийг тогтоох; улсын цол, одон, медаль, цэргийн дээд цол бий болгох, төрийн албаны зарим тусгай салбарын албан тушаалын зэрэг дэвийг тогтоох; өршөөл үзүүлэх шийдвэр гаргах; Засгийн газрын өргөн мэдүүлснээр Монгол Улсын олон улсын гэрээг соёрхон батлах, цуцлах, гадаад улстай дипломат харилцаа тогтоох, цуцлах; ард нийтийн санал асуулга явуулах. Монгол Улс өөрийн тусгаар тогтнол, нутаг дэвсгэрийн бүрэн бүтэн байдлыг үгүйсгэх аливаа оролдлогыг үл зөвшөөрөх бөгөөд мөнхүү зорилгоор ард нийтийн санал асуулга явуулахыг хориглоно; Сонгуулийн эрх бүхий иргэдийн олонхи нь оролцсон ард нийтийн санал асуулгыг хүчинтэйд тооцож, олонхийн санал авсан асуудлыг шийдвэрлэгдсэн гэж үзнэ; Монгол Улсын тусгаар тогтнол, бүрэн эрхт байдалд бусад улсаас аюул занал учруулж, зэвсэглэн халдвал дайн бүхий байдал зарлах, цуцлах; энэ зүйлийн 2, 3 дахь хэсэгт заасан онцгой нөхцөлд улсын нийт нутаг дэвсгэрт буюу зарим хэсэгт нь онц болон дайны байдал зарлах, эсхүл энэ тухай гаргасан Ерөнхийлөгчийн зарлигийг батлах, хүчингүй болгох. Дараахь онцгой нөхцөл бий болсон үед үр дагаврыг нь арилгах, хүн ам, нийгмийн амьдралыг хэвийн болгохын тулд онц байдал зарлаж болно: 1/улсын нийт нутаг дэвсгэрт буюу зарим хэсэгт нь оршин суугаа хүн амын амь нас, эрүүл мэнд, аж амьдрал, нийтийн аюулгүй байдалд шууд аюул учруулсан буюу учруулахуйц байгалийн гамшиг, гэнэтийн бусад аюул тохиолдсон; 2/Үндсэн хуулийн дэг журам, нийгмийн хууль ёсны тогтолцоо оршин тогтноход заналхийлсэн аливаа байгууллага, бүлэг хүний зохион байгуулалт бүхий хүч хэрэглэсэн хууль бус үйл ажиллагааны улмаас үүссэн нийтийн эмх замбараагүй байдлыг төрийн байгууллага эрх хэмжээнийхээ дотор ердийн арга хэрэгслээр тохинуулах боломжгүй болсон. Улсын нийт нутаг дэвсгэрт буюу зарим хэсэгт нь нийтийн эмх замбараагүй байдал үүсч, зэвсэгт мөргөлдөөнд хүрсэн, тийм мөргөлдөөн гарах бодит аюул бий болсон, бусад улсаас цэргийн хүчээр түрэмгийлэн халдсан, эсхүл тийнхүү халдах нь бодитой болсон үед дайны байдал зарлаж болно. Улсын Их Хурлын бусад бүрэн эрх, зохион байгуулалт, үйл ажиллагааны журмыг хуулиар тогтооно.", "provisions": [{"pid": "25.1.1", "kind": "power", "actor": "УИХ", "summary": "Хууль батлах", "delegates": false, "limits": null, "amended": []}, {"pid": "25.1.6", "kind": "power", "actor": "УИХ", "summary": "Ерөнхий сайд, хариуцлагатай байгууллагыг томилох, огцруулах", "delegates": false, "limits": null, "amended": [2019]}, {"pid": "25.1.7", "kind": "power", "actor": "УИХ", "summary": "Төсөв батлах; Засгийн газрын өргөн мэдүүлсэн зарлага, алдагдлыг нэмэгдүүлэхгүй; хараат бус санхүүгийн хяналтын байгууллагыг хуулиар", "delegates": true, "limits": "зарлага/алдагдал нэмэхгүй (өрийн хязгаар, анхдагч төсөвгүй)", "amended": [2019]}, {"pid": "25.1.16", "kind": "power", "actor": "УИХ", "summary": "Санал асуулга; сонгогчдын олонхи оролцвол хүчинтэй; тусгаар тогтнолын эсрэг хориглоно", "delegates": false, "limits": null, "amended": [2019]}, {"pid": "25.1.18", "kind": "power", "actor": "УИХ", "summary": "Онц/дайны байдал зарлах, Ерөнхийлөгчийн зарлигийг батлах", "delegates": false, "limits": null, "amended": []}, {"pid": "25.2", "kind": "declaration", "actor": "УИХ", "summary": "Онц байдлын үндэслэл (гамшиг, эмх замбараагүй байдал)", "delegates": false, "limits": null, "amended": []}, {"pid": "25.4", "kind": "delegation", "actor": "УИХ", "summary": "УИХ-ын бусад бүрэн эрхийг хуулиар", "delegates": true, "limits": null, "amended": []}], "findings": [0, 7, 13, 39, 60], "modality": {"permission": 4, "descriptive": 24, "prohibition": 2}}, {"number": "26", "chapter": 3, "title": "Хууль санаачлах", "text": "Ерөнхийлөгч, Улсын Их Хурлын гишүүн, Засгийн газар хууль санаачлах эрх эдлэх бөгөөд энэхүү эрхийн хүрээ, хязгаарыг хуулиар тогтооно. Иргэд, бусад байгууллага хуулийн төслийн тухай саналаа хууль санаачлагчид уламжилна. Монгол Улсын хуулийг Улсын Их Хурал албан ёсоор нийтлэх бөгөөд хэрэв хуульд өөрөөр заагаагүй бол ийнхүү нийтэлснээс хойш арав хоногийн дараа хүчин төгөлдөр болно.", "provisions": [{"pid": "26.1", "kind": "power", "actor": "Ерөнхийлөгч, УИХ-ын гишүүн, Засгийн газар", "summary": "Хууль санаачлах; хүрээг хуулиар", "delegates": true, "limits": null, "amended": [2019]}, {"pid": "26.2", "kind": "declaration", "actor": "иргэд", "summary": "Иргэд саналаа санаачлагчид уламжилна (шууд санаачилгагүй)", "delegates": false, "limits": null, "amended": []}, {"pid": "26.3", "kind": "procedure", "actor": "УИХ", "summary": "Хууль нийтэлснээс 10 хоногийн дараа хүчин төгөлдөр", "delegates": false, "limits": null, "amended": []}], "findings": [13, 58], "modality": {"descriptive": 2, "permission": 1}}, {"number": "27", "chapter": 3, "title": "Чуулган, ирц, санал хураалт", "text": "Улсын Их Хурал бүрэн эрхээ чуулган, зохион байгуулалтын бусад хэлбэрээр хэрэгжүүлнэ. Улсын Их Хурлын ээлжит чуулган хагас жил тутам нэг удаа далан таваас доошгүй ажлын өдөр чуулна. Улсын Их Хурлын гишүүдийн гуравны нэгээс дээшхийн шаардсанаар, эсхүл Ерөнхийлөгч, Улсын Их Хурлын даргын санаачилгаар ээлжит бус чуулган чуулж болно. Улсын Их Хурлын анхдугаар чуулганыг сонгууль явуулсан өдрөөс хойш гуч хоногийн дотор Ерөнхийлөгч, бусад чуулганыг Улсын Их Хурлын дарга товлон зарлана. Ерөнхийлөгч онц болон дайны байдал зарлавал түүнээс хойш далан хоёр цагийн дотор Улсын Их Хурал онцгой чуулганаа тусгайлан товлохгүйгээр чуулна. Улсын Их Хурлын чуулганы нэгдсэн болон Байнгын хорооны хуралдааныг гишүүдийн олонхи нь хүрэлцэн ирснээр хүчинтэйд үзэж, Үндсэн хуульд өөрөөр заагаагүй бол хуралдаанд оролцсон гишүүдийн олонхийн саналаар асуудлыг шийдвэрлэнэ. Үндсэн хуульд өөрөөр заагаагүй бол Улсын Их Хурлын нийт гишүүний олонхийн саналаар хуулийг эцэслэн батална. Улсын Их Хурлын гишүүд саналаа илээр гаргаж асуудлыг шийдвэрлэнэ. Үндсэн хууль, бусад хуульд заасан, эсхүл хуралдаанд оролцсон гишүүдийн олонхи дэмжсэн бол нууц санал хураалт явуулна.", "provisions": [{"pid": "27.2", "kind": "procedure", "actor": "УИХ", "summary": "Ээлжит чуулган хагас жил тутам, 75-аас доошгүй ажлын өдөр", "delegates": false, "limits": null, "amended": [1999, 2000, 2019]}, {"pid": "27.3", "kind": "procedure", "actor": "УИХ", "summary": "Гишүүдийн 1/3+ эсвэл Ерөнхийлөгч, даргын санаачилгаар ээлжит бус чуулган", "delegates": false, "limits": null, "amended": []}, {"pid": "27.5", "kind": "procedure", "actor": "УИХ", "summary": "Онц байдал зарласнаас 72 цагт онцгой чуулган", "delegates": false, "limits": null, "amended": []}, {"pid": "27.6", "kind": "procedure", "actor": "УИХ", "summary": "Ирц олонхи; оролцсон олонхиор шийднэ; хуулийг нийт гишүүний олонхиор батална", "delegates": false, "limits": null, "amended": [1999, 2000, 2019]}, {"pid": "27.7", "kind": "procedure", "actor": "УИХ", "summary": "Ил санал хураалт; оролцсон олонхи дэмжвэл нууц", "delegates": false, "limits": null, "amended": [2019]}], "findings": [12], "modality": {"descriptive": 8, "permission": 1}}, {"number": "28", "chapter": 3, "title": "Байнгын хороо", "text": "Улсын Их Хурал үйл ажиллагааныхаа зохих салбар, чиглэлээр Байнгын хороодтой байна. Хуулийн биелэлтийг хангахтай холбоотой нийтийн ашиг сонирхлыг хөндсөн тодорхой асуудлаар Улсын Их Хурлын нийт гишүүний дөрөвний нэгээс доошгүй нь хянан шалгах түр хороо байгуулах санал тавибал Улсын Их Хурал цөөнхийн төлөөллийг оролцуулан уг хороог байгуулна. Байнгын болон бусад хорооны бүрэн эрх, зохион байгуулалт, үйл ажиллагааны журмыг хуулиар тогтооно.", "provisions": [{"pid": "28.2", "kind": "procedure", "actor": "УИХ", "summary": "Нийт гишүүний 1/4 санал тавибал цөөнхийн оролцоотой хянан шалгах түр хороо байгуулна", "delegates": true, "limits": null, "amended": [2019]}], "findings": [13], "modality": {"descriptive": 3}}, {"number": "29", "chapter": 3, "title": "Гишүүний хязгаарлалт, эгүүлэн татах", "text": "Улсын Их Хурлын гишүүн бүрэн эрхийнхээ хугацаанд улсын төсвөөс цалин авна. Улсын Их Хурлын гишүүн нь Ерөнхий сайд, Засгийн газрын гишүүнээс бусад, хуулиар тогтоосон үүрэгт нь үл хамаарах ажил, албан тушаал хавсарч болохгүй. Улсын Их Хурлын гишүүний халдашгүй байдлыг хуулиар хамгаална. Улсын Их Хурлын гишүүн бүрэн эрхээ хэрэгжүүлэхдээ өргөсөн тангаргаасаа няцаж Үндсэн хууль зөрчсөн бол түүнийг Улсын Их Хурлын гишүүнээс эгүүлэн татах үндэслэл болно. Улсын Их Хурлын гишүүн гэмт хэрэгт холбогдсон тухай асуудлыг Улсын Их Хурлын чуулганаар хэлэлцэж, бүрэн эрхийг нь түдгэлзүүлэх эсэхийг шийдвэрлэнэ. Уул гишүүн гэмт хэрэг үйлдсэн гэж шүүх тогтоовол Улсын Их Хурал түүнийг гишүүнээс нь эгүүлэн татна.", "provisions": [{"pid": "29.1", "kind": "prohibition", "actor": "УИХ-ын гишүүн", "summary": "Ерөнхий сайд, Засгийн газрын гишүүнээс бусад албан тушаал хавсрахгүй", "delegates": false, "limits": null, "amended": [1999, 2000]}, {"pid": "29.2", "kind": "delegation", "actor": "УИХ", "summary": "Гишүүний халдашгүй байдлыг хуулиар", "delegates": true, "limits": null, "amended": []}, {"pid": "29.3", "kind": "procedure", "actor": "УИХ", "summary": "Тангаргаасаа няцаж Үндсэн хууль зөрчвөл эгүүлэн татах; шүүх гэм буруутай гэвэл эгүүлэн татна", "delegates": false, "limits": null, "amended": [2019]}], "findings": [13, 28], "modality": {"descriptive": 4, "prohibition": 1, "permission": 1}}, {"number": "30", "chapter": 3, "title": "Ерөнхийлөгч", "text": "Монгол Улсын Ерөнхийлөгч бол төрийн тэргүүн, Монголын ард түмний эв нэгдлийг илэрхийлэгч мөн. Ерөнхийлөгчөөр тавин нас хүрсэн, сүүлийн таваас доошгүй жил эх орондоо байнга оршин суусан, Монгол Улсын уугуул иргэнийг зургаан жилийн хугацаагаар зөвхөн нэг удаа сонгоно.", "provisions": [{"pid": "30.1", "kind": "declaration", "actor": "Ерөнхийлөгч", "summary": "Төрийн тэргүүн, ард түмний эв нэгдлийг илэрхийлэгч", "delegates": false, "limits": null, "amended": []}, {"pid": "30.2", "kind": "prohibition", "actor": "Ерөнхийлөгч", "summary": "6 жилээр зөвхөн нэг удаа сонгоно", "delegates": false, "limits": null, "amended": [2019]}], "findings": [], "modality": {"descriptive": 2}}, {"number": "31", "chapter": 3, "title": "Ерөнхийлөгчийн сонгууль", "text": "Ерөнхийлөгчийн сонгууль хоёр шаттай байна. Улсын Их Хуралд суудал бүхий нам дангаараа буюу хамтран Ерөнхийлөгчид тус бүр нэг хүний нэр дэвшүүлнэ. Анхан шатны сонгуульд Монгол Улсын сонгуулийн эрх бүхий иргэд нийтээрээ, чөлөөтэй, шууд сонгох эрхтэй оролцож, Ерөнхийлөгчид нэр дэвшигчийн талаар саналаа нууцаар гаргана. Ерөнхийлөгчийн анхан шатны сонгуульд оролцсон нийт сонгогчийн олонхийн санал авсан нэр дэвшигчийг Улсын Их Хурал Ерөнхийлөгчөөр сонгогдсон гэж үзэж бүрэн эрхийг нь хүлээн зөвшөөрсөн хууль гаргана. Ерөнхийлөгчид нэр дэвшигчдийн хэн нь ч ийнхүү сонгогчдын олонхийн санал аваагүй бол анхны санал хураалтад оролцсон нийт сонгогчийн хамгийн олон санал авсан хоёр хүнийг дахин санал хураалтад оруулна. Дахин санал хураалтаар сонгуульд оролцсон нийт сонгогчийн олонхийн санал авсан нэр дэвшигчийг Улсын Их Хурал Ерөнхийлөгчөөр сонгогдсон гэж үзэж бүрэн эрхийг нь хүлээн зөвшөөрсөн хууль гаргана. Хэрэв хоёр дахь санал хураалтаар Ерөнхийлөгчид нэр дэвшигчдийн хэн нь ч ийнхүү сонгогчдын олонхийн санал аваагүй бол дахин сонгууль явуулна. /Энэ хэсгийг 2019 оны 11 дүгээр сарын 14-ний өдөр баталсан Монгол Улсын Үндсэн хуульд оруулсан нэмэлт, өөрчлөлтөөр хүчингүй болсонд тооцсон./ Ерөнхийлөгч нь Ерөнхий сайд, Улсын Их Хурал, Засгийн газрын гишүүн, хуулиар тогтоосон үүрэгт нь үл хамаарах бусад ажил, албан тушаал хавсарч болохгүй. Хэрэв Ерөнхийлөгч өөр ажил, албан тушаал эрхэлж байгаа бол тангараг өргөсөн өдрөөсөө эхлэн уул үүргээс чөлөөлөгдөнө.", "provisions": [{"pid": "31.2", "kind": "procedure", "actor": "нам", "summary": "УИХ-д суудалтай нам нэр дэвшүүлнэ", "delegates": false, "limits": null, "amended": []}, {"pid": "31.4", "kind": "procedure", "actor": "УИХ", "summary": "Олонхи авсныг бүрэн эрхийг хүлээн зөвшөөрсөн хууль гаргана", "delegates": false, "limits": null, "amended": []}, {"pid": "31.6", "kind": "procedure", "actor": "сонгогч", "summary": "Хоёр дахь санал хураалтад олонхи гараагүй бол дахин сонгууль (хязгааргүй)", "delegates": false, "limits": null, "amended": []}, {"pid": "31.8", "kind": "prohibition", "actor": "Ерөнхийлөгч", "summary": "Ерөнхий сайд, УИХ, Засгийн газрын гишүүн хавсрахгүй", "delegates": false, "limits": null, "amended": []}], "findings": [11, 29], "modality": {"descriptive": 8, "right": 1, "prohibition": 1}}, {"number": "32", "chapter": 3, "title": "Ерөнхийлөгчийн бүрэн эрхийн хугацаа", "text": "Ерөнхийлөгчийн бүрэн эрх тангараг өргөснөөр эхэлж, шинэ сонгогдсон Ерөнхийлөгч тангараг өргөснөөр дуусгавар болно. Ерөнхийлөгч сонгогдсоноосоо хойш гуч хоногийн дотор \"Монгол Улсын тусгаар тогтнол, бүрэн эрхт байдал, ард түмнийхээ эрх чөлөө, үндэсний эв нэгдлийг эрхэмлэн хамгаалж, Үндсэн хуулийг дээдлэн сахиж, Ерөнхийлөгчийн үүргийг шударгаар биелүүлэхээ батлан тангараглая\" хэмээн Улсын Их Хуралд тангараг өргөнө.", "provisions": [{"pid": "32.1", "kind": "declaration", "actor": "Ерөнхийлөгч", "summary": "Бүрэн эрх шинэ Ерөнхийлөгч тангараг өргөтөл үргэлжилнэ", "delegates": false, "limits": null, "amended": []}, {"pid": "32.2", "kind": "procedure", "actor": "Ерөнхийлөгч", "summary": "Сонгогдсоноос 30 хоногт тангараг", "delegates": false, "limits": null, "amended": []}], "findings": [29], "modality": {"permission": 1, "descriptive": 1}}, {"number": "33", "chapter": 3, "title": "Ерөнхийлөгчийн бүрэн эрх", "text": "Ерөнхийлөгч дараахь үндсэн бүрэн эрхийг хэрэгжүүлнэ: Улсын Их Хурлын баталсан хууль, бусад шийдвэрт бүхэлд нь буюу зарим хэсэгт нь хориг тавих. Ерөнхийлөгчийн тавьсан хоригийг Улсын Их Хурлаар хэлэлцэж, чуулганд оролцсон нийт гишүүний гуравны хоёр нь хүлээж аваагүй бол уг хууль, шийдвэр хүчин төгөлдөр хэвээр үлдэнэ; /Энэ заалтыг 1999 оны 12 дугаар сарын 24-ний өдөр баталсан Монгол Улсын Үндсэн хуульд оруулсан нэмэлт, өөрчлөлтөөр өөрчлөн найруулсан бөгөөд уг өөрчлөлтийг Үндсэн хуулийн цэцийн 2000 оны 02 дугаар тогтоолоор хүчингүй болгосон. Мөн заалтыг 2000 оны 12 дугаар сарын 14-ний өдөр баталсан Монгол Улсын Үндсэн хуульд оруулсан нэмэлт, өөрчлөлтөөр өөрчлөн найруулсан. Мөн заалтыг 2019 оны 11 дүгээр сарын 14-ний өдөр баталсан Монгол Улсын Үндсэн хуульд оруулсан нэмэлт, өөрчлөлтөөр хүчингүй болсонд тооцсон./ өөрийн бүрэн эрхэд хамаарах асуудлаар Засгийн газарт чиглэл өгөх. Энэ талаар Ерөнхийлөгч зарлиг гаргавал түүнд Ерөнхий сайд гарын үсэг зурснаар хүчин төгөлдөр болно; гадаад харилцаанд улсаа бүрэн эрхтэй төлөөлж, Улсын Их Хуралтай зөвшилцөн Монгол Улсын нэрийн өмнөөс олон улсын гэрээ байгуулах; Монгол Улсаас гадаад улсад суух бүрэн эрхт төлөөлөгчийн газрын тэргүүнийг Улсын Их Хуралтай зөвшилцөн томилох буюу эгүүлэн татах; Монгол Улсад суух гадаад улсын бүрэн эрхт төлөөлөгчийн газрын тэргүүний итгэмжлэх, эгүүлэн татах жуух бичгийг хүлээн авах; улсын цол, цэргийн дээд цол хүртээх, одон, медалиар шагнах; уучлал үзүүлэх; Монгол Улсын харьяат болох, харьяатаас гарах, тус улсад орогнох эрх олгох асуудлыг шийдвэрлэх; Монгол Улсын үндэсний аюулгүй байдлын зөвлөлийг тэргүүлэх; бүх нийтийн буюу хэсэгчилсэн цэргийн дайчилгаа зарлах; Үндсэн хуулийн хорин тавдугаар зүйлийн 2, 3 дахь хэсэгт заасан онцгой нөхцөл бий болбол Улсын Их Хурлын чуулганы чөлөө цагт, хойшлуулшгүй тохиолдолд улсын нийт нутаг дэвсгэрт буюу зарим хэсэгт нь онц болон дайны байдал зарлах, түүнчлэн цэрэг хөдөлгөх захирамж өгөх. Онц байдал, дайны байдал зарласан Ерөнхийлөгчийн зарлигийг Улсын Их Хурал уул зарлиг гарснаас хойш долоо хоногийн дотор хэлэлцэж батлах буюу хүчингүй болгоно. Хэрэв Улсын Их Хурал шийдвэр гаргаагүй бол уул зарлиг хүчингүй болно. Ерөнхийлөгч Монгол Улсын зэвсэгт хүчний ерөнхий командлагч байна. Ерөнхийлөгч Улсын Их Хуралд болон ард түмэндээ хандан илгээлт гаргаж, чуулганд өөрийн тааллаар оролцон улс орны дотоод, гадаад байдлын нэн чухал асуудлаар мэдээлж, саналаа оруулж болно. Ерөнхийлөгчид тодорхой бүрэн эрхийг зөвхөн энэ зүйлд заасан хүрээнд хуулиар олгож болно.", "provisions": [{"pid": "33.1.1", "kind": "power", "actor": "Ерөнхийлөгч", "summary": "УИХ-ын хууль, бусад шийдвэрт хориг; оролцсон нийт гишүүний 2/3 хүлээж аваагүй бол хүчин төгөлдөр", "delegates": false, "limits": null, "amended": []}, {"pid": "33.1.3", "kind": "power", "actor": "Ерөнхийлөгч", "summary": "Засгийн газарт чиглэл өгөх; Ерөнхий сайд гарын үсэг зурвал хүчинтэй", "delegates": false, "limits": null, "amended": []}, {"pid": "33.1.4", "kind": "power", "actor": "Ерөнхийлөгч", "summary": "УИХ-тай зөвшилцөн олон улсын гэрээ байгуулах", "delegates": false, "limits": null, "amended": []}, {"pid": "33.1.5", "kind": "power", "actor": "Ерөнхийлөгч", "summary": "УИХ-тай зөвшилцөн элчин сайд томилох", "delegates": false, "limits": null, "amended": []}, {"pid": "33.1.12", "kind": "power", "actor": "Ерөнхийлөгч", "summary": "Чуулганы завсарлагаар онц/дайны байдал зарлах; УИХ 7 хоногт батлахгүй бол хүчингүй", "delegates": false, "limits": null, "amended": []}, {"pid": "33.2", "kind": "declaration", "actor": "Ерөнхийлөгч", "summary": "Зэвсэгт хүчний ерөнхий командлагч", "delegates": false, "limits": null, "amended": []}, {"pid": "33.4", "kind": "delegation", "actor": "УИХ", "summary": "Ерөнхийлөгчид зөвхөн энэ зүйлийн хүрээнд хуулиар бүрэн эрх олгоно", "delegates": true, "limits": "33 дугаар зүйлийн хүрээ", "amended": [2019]}], "findings": [0, 12, 25, 25, 36, 40, 40, 54], "modality": {"descriptive": 16, "permission": 5, "right": 1}}, {"number": "34", "chapter": 3, "title": "Зарлиг", "text": "Ерөнхийлөгч бүрэн эрхийнхээ хүрээнд хуульд нийцүүлэн зарлиг гаргана. Ерөнхийлөгчийн зарлиг хуульд нийцээгүй бол Ерөнхийлөгч өөрөө буюу Улсын Их Хурал хүчингүй болгоно.", "provisions": [{"pid": "34.2", "kind": "procedure", "actor": "Ерөнхийлөгч/УИХ", "summary": "Хуульд нийцээгүй зарлигийг Ерөнхийлөгч эсвэл УИХ хүчингүй болгоно", "delegates": false, "limits": null, "amended": []}], "findings": [], "modality": {"descriptive": 2}}, {"number": "35", "chapter": 3, "title": "Ерөнхийлөгчийн хариуцлага", "text": "Ерөнхийлөгч Улсын Их Хуралд ажлаа хариуцна. Ерөнхийлөгч тангаргаасаа няцаж Үндсэн хууль, Ерөнхийлөгчийн бүрэн эрхийг зөрчвөл Үндсэн хуулийн цэцийн дүгнэлтийг үндэслэн Улсын Их Хурлаар хэлэлцэж чуулганд оролцсон нийт гишүүний дийлэнх олонхийн саналаар огцруулна.", "provisions": [{"pid": "35.1", "kind": "declaration", "actor": "Ерөнхийлөгч", "summary": "УИХ-д ажлаа хариуцна", "delegates": false, "limits": null, "amended": []}, {"pid": "35.2", "kind": "procedure", "actor": "УИХ", "summary": "Цэцийн дүгнэлтээр, оролцсон гишүүний «дийлэнх олонхи»-оор огцруулна", "delegates": false, "limits": null, "amended": []}], "findings": [14, 37], "modality": {"descriptive": 2}}, {"number": "36", "chapter": 3, "title": "Халдашгүй байдал", "text": "Ерөнхийлөгчийн бие, өргөө, унаа халдашгүй дархан байна. Ерөнхийлөгчийн нэр төр, халдашгүй байдлыг хуулиар хамгаална.", "provisions": [{"pid": "36.2", "kind": "delegation", "actor": "УИХ", "summary": "Ерөнхийлөгчийн халдашгүй байдлыг хуулиар", "delegates": true, "limits": null, "amended": []}], "findings": [13], "modality": {"descriptive": 2}}, {"number": "37", "chapter": 3, "title": "Ерөнхийлөгчийг орлох", "text": "Ерөнхийлөгчийг түр эзгүйд бүрэн эрхийг нь Улсын Их Хурлын дарга хэрэгжүүлнэ. Ерөнхийлөгч огцорсон, нас нөгчсөн, хүсэлтээрээ чөлөөлөгдсөн бол Ерөнхийлөгч шинээр сонгогдож тангараг өргөх хүртэл бүрэн эрхийг нь Улсын Их Хурлын дарга хэрэгжүүлнэ. Энэ тохиолдолд Улсын Их Хурал Ерөнхийлөгчийн сонгуулийг дөрвөн сарын дотор зарлан явуулна. Улсын Их Хурлын дарга Ерөнхийлөгчийн үүрэг гүйцэтгэх журмыг хуулиар тогтооно.", "provisions": [{"pid": "37.1", "kind": "procedure", "actor": "УИХ-ын дарга", "summary": "Түр эзгүйд УИХ-ын дарга орлоно (дарга эзгүй бол заагаагүй)", "delegates": false, "limits": null, "amended": []}, {"pid": "37.2", "kind": "procedure", "actor": "УИХ", "summary": "Огцорсон/нас барсан бол 4 сард сонгууль", "delegates": false, "limits": null, "amended": []}, {"pid": "37.3", "kind": "delegation", "actor": "УИХ", "summary": "Орлох журмыг хуулиар", "delegates": true, "limits": null, "amended": []}], "findings": [13], "modality": {"descriptive": 4}}, {"number": "38", "chapter": 3, "title": "Засгийн газрын бүрэн эрх", "text": "Монгол Улсын Засгийн газар бол төрийн гүйцэтгэх дээд байгууллага мөн. Засгийн газар төрийн хуулийг биелүүлж, аж ахуй, нийгэм, соёлын байгуулалтыг удирдах нийтлэг чиг үүргийн дагуу дараахь үндсэн бүрэн эрхийг хэрэгжүүлнэ: Үндсэн хууль, бусад хуулийн биелэлтийг улс даяар зохион байгуулж хангах; шинжлэх ухаан, технологийн нэгдсэн бодлого, улсын эдийн засаг, нийгмийн хөгжлийн үндсэн чиглэл, улсын төсөв, зээл, санхүүгийн төлөвлөгөөг боловсруулж Улсын Их Хуралд өргөж, гарсан шийдвэрийг биелүүлэх; салбарын ба салбар хоорондын, түүнчлэн бүс нутгийн хөгжлийн асуудлаар арга хэмжээ боловсруулж хэрэгжүүлэх; хүрээлэн байгаа орчныг хамгаалах, байгалийн баялгийг зүй зохистой ашиглах, нөхөн сэргээх арга хэмжээ авах; төрийн захиргааны төв байгууллагыг шуурхай удирдаж, нутгийн захиргааны байгууллагын үйл ажиллагааг удирдан чиглүүлэх; улсыг батлан хамгаалах хүчин чадлыг бэхжүүлж, үндэсний аюулгүй байдлыг хангах; хүний эрх, эрх чөлөөг хамгаалах, нийгмийн хэв журмыг бэхжүүлэх, гэмт хэрэгтэй тэмцэх арга хэмжээ авч хэрэгжүүлэх; төрийн гадаад бодлого хэрэгжүүлэх; Улсын Их Хуралтай зөвшилцөж дараа соёрхон батлуулахаар Монгол Улсын олон улсын гэрээ байгуулах, хэрэгжүүлэх, түүнчлэн Засгийн газар хоорондын гэрээ байгуулах, цуцлах. Засгийн газрын тодорхой бүрэн эрх, зохион байгуулалт, үйл ажиллагааны журмыг хуулиар тогтооно.", "provisions": [{"pid": "38.1", "kind": "declaration", "actor": "Засгийн газар", "summary": "Төрийн гүйцэтгэх дээд байгууллага", "delegates": false, "limits": null, "amended": []}, {"pid": "38.2.4", "kind": "duty", "actor": "Засгийн газар", "summary": "Байгаль орчныг хамгаалах, баялгийг зүй зохистой ашиглах арга хэмжээ авах", "delegates": false, "limits": null, "amended": []}, {"pid": "38.3", "kind": "delegation", "actor": "УИХ", "summary": "Засгийн газрын бүрэн эрхийг хуулиар", "delegates": true, "limits": null, "amended": []}], "findings": [13], "modality": {"descriptive": 12}}, {"number": "39", "chapter": 3, "title": "Засгийн газрыг бүрдүүлэх", "text": "Засгийн газар Ерөнхий сайд, гишүүдээс бүрдэнэ. Ерөнхий сайд болон Засгийн газрын дөрвөөс илүүгүй гишүүн Улсын Их Хурлын гишүүний албан тушаалыг хавсарч болно. Улсын Их Хуралд олонхи суудал авсан нам, эвслээс нэр дэвшүүлсэн хүнийг; аль ч нам, эвсэл олонхийн суудал аваагүй бол хамгийн олон суудал авсан нам, эвсэл бусад нам, эвсэлтэй зөвшилцөн олонхийг бүрдүүлж нэр дэвшүүлсэн хүнийг; бусад тохиолдолд Улсын Их Хуралд суудал авсан нам, эвсэл зөвшилцөн олонхийг бүрдүүлж нэр дэвшүүлсэн хүнийг Ерөнхий сайдаар томилох саналыг Ерөнхийлөгч тав хоногийн дотор Улсын Их Хуралд оруулна. Монгол Улсын Ерөнхий сайд Засгийн газрын бүтэц, бүрэлдэхүүн, түүнд өөрчлөлт оруулах тухай хуулийн төслийг Ерөнхийлөгчтэй зөвшилцөн Улсын Их Хуралд өргөн мэдүүлнэ. Ерөнхий сайд энэ асуудлыг Ерөнхийлөгчтэй долоо хоногийн дотор зөвшилцөж чадаагүй бол Улсын Их Хуралд өөрөө өргөн мэдүүлнэ. Засгийн газрын гишүүнийг Улсын Их Хурал, Ерөнхийлөгчид танилцуулснаар Ерөнхий сайд томилж, чөлөөлж, огцруулна. Засгийн газрын гишүүн Улсын Их Хуралд тангараг өргөнө.", "provisions": [{"pid": "39.1", "kind": "declaration", "actor": "Засгийн газар", "summary": "Ерөнхий сайд, гишүүдээс бүрдэнэ; '4-өөс илүүгүй гишүүн давхар' гэснийг 2022-оор хүчингүй болгосон", "delegates": false, "limits": null, "amended": [2019, 2022]}, {"pid": "39.2", "kind": "procedure", "actor": "Ерөнхийлөгч", "summary": "Олонхийн нэр дэвшүүлсэн хүнийг 5 хоногт УИХ-д оруулна", "delegates": false, "limits": null, "amended": [2019]}, {"pid": "39.3", "kind": "procedure", "actor": "Ерөнхий сайд", "summary": "Бүтцийн хуулийг Ерөнхийлөгчтэй 7 хоног зөвшилцөөд, болохгүй бол өөрөө өргөн мэдүүлнэ", "delegates": false, "limits": null, "amended": [2019]}, {"pid": "39.4", "kind": "procedure", "actor": "Ерөнхий сайд", "summary": "Гишүүдийг УИХ, Ерөнхийлөгчид танилцуулаад томилно", "delegates": false, "limits": null, "amended": [2019]}], "findings": [28, 61], "modality": {"descriptive": 8, "permission": 1}}, {"number": "40", "chapter": 3, "title": "Засгийн газрын хугацаа", "text": "Засгийн газрын бүрэн эрхийн хугацаа дөрвөн жил байна. Засгийн газрын бүрэн эрх Улсын Их Хурлаас Ерөнхий сайдыг томилсноор эхэлж, шинэ Ерөнхий сайдыг томилсноор дуусгавар болно.", "provisions": [{"pid": "40.1", "kind": "declaration", "actor": "Засгийн газар", "summary": "4 жил", "delegates": false, "limits": null, "amended": []}, {"pid": "40.2", "kind": "declaration", "actor": "Засгийн газар", "summary": "Ерөнхий сайдыг томилсноор эхэлж, шинэ Ерөнхий сайд томилсноор дуусна", "delegates": false, "limits": null, "amended": []}], "findings": [], "modality": {"descriptive": 1, "permission": 1}}, {"number": "41", "chapter": 3, "title": "Хариуцлага", "text": "Ерөнхий сайд Засгийн газрыг удирдаж, төрийн хууль биелүүлэх ажлыг Улсын Их Хурлын өмнө хариуцна. Засгийн газар үйл ажиллагаагаа Улсын Их Хуралд тайлагнана.", "provisions": [{"pid": "41.1", "kind": "declaration", "actor": "Ерөнхий сайд", "summary": "УИХ-ын өмнө хариуцна", "delegates": false, "limits": null, "amended": []}, {"pid": "41.2", "kind": "duty", "actor": "Засгийн газар", "summary": "УИХ-д тайлагнана", "delegates": false, "limits": null, "amended": []}], "findings": [], "modality": {"descriptive": 2}}, {"number": "42", "chapter": 3, "title": "Халдашгүй байдал", "text": "Ерөнхий сайд, Засгийн газрын гишүүний халдашгүй байдлыг хуулиар хамгаална.", "provisions": [{"pid": "42", "kind": "delegation", "actor": "УИХ", "summary": "Ерөнхий сайд, гишүүний халдашгүй байдлыг хуулиар", "delegates": true, "limits": null, "amended": []}], "findings": [13], "modality": {"descriptive": 1}}, {"number": "43", "chapter": 3, "title": "Ерөнхий сайдыг огцруулах", "text": "Улсын Их Хурлын гишүүдийн дөрөвний нэгээс доошгүй нь Ерөнхий сайдыг огцруулах саналыг албан ёсоор тавибал Улсын Их Хурал гурав хоногийн дараа хэлэлцэж эхлэн арав хоногийн дотор шийдвэрлэнэ. Улсын Их Хурлын нийт гишүүний олонхи уг саналыг дэмжсэн бол Ерөнхий сайдыг огцруулах тухай Улсын Их Хурлын тогтоол баталсанд тооцож, шинэ Ерөнхий сайдыг гуч хоногийн дотор томилно. Ерөнхий сайд огцорвол Засгийн газар бүрэлдэхүүнээрээ огцорно.", "provisions": [{"pid": "43.1", "kind": "procedure", "actor": "УИХ", "summary": "1/4 санал тавибал 3 хоногийн дараа хэлэлцэж 10 хоногт шийднэ; нийт олонхиор; 30 хоногт шинэ Ерөнхий сайд", "delegates": false, "limits": null, "amended": [2019]}, {"pid": "43.2", "kind": "procedure", "actor": "Засгийн газар", "summary": "Ерөнхий сайд огцорвол Засгийн газар бүрэлдэхүүнээрээ огцорно", "delegates": false, "limits": null, "amended": [2019]}], "findings": [0, 59], "modality": {"descriptive": 3}}, {"number": "44", "chapter": 3, "title": "Итгэл хүлээлгэх", "text": "Ерөнхий сайд улсын төсвийн болон бодлогын тодорхой асуудлаар өөрт нь итгэл хүлээлгэх тогтоолын төслийг оруулбал Улсын Их Хурал гурав хоногийн дараа хэлэлцэж эхлэн арав хоногийн дотор Улсын Их Хурлын нийт гишүүний олонхийн саналаар шийдвэрлэнэ. Улсын Их Хурал тогтоолыг баталсан бол Ерөнхий сайдад итгэл үзүүлж, тухайн асуудлыг дэмжсэнд тооцно. Тогтоолыг батлаагүй бол Ерөнхий сайдыг огцорсонд тооцож, шинэ Ерөнхий сайдыг гуч хоногийн дотор томилно.", "provisions": [{"pid": "44.1", "kind": "procedure", "actor": "УИХ", "summary": "Итгэлийн тогтоолыг 3 хоногийн дараа хэлэлцэж 10 хоногт нийт олонхиор шийднэ", "delegates": false, "limits": null, "amended": [2019]}, {"pid": "44.2", "kind": "procedure", "actor": "УИХ", "summary": "Батлаагүй бол огцорсонд тооцож 30 хоногт шинэ Ерөнхий сайд", "delegates": false, "limits": null, "amended": [2019]}], "findings": [], "modality": {"descriptive": 3}}, {"number": "45", "chapter": 3, "title": "Засгийн газрын шийдвэр", "text": "Засгийн газар хууль тогтоомжид нийцүүлэн бүрэн эрхийнхээ дотор тогтоол, захирамж гаргах бөгөөд түүнд Ерөнхий сайд, тухайн шийдвэрийн биелэлтийг хариуцсан сайд гарын үсэг зурна. Засгийн газрын тогтоол, захирамж нь хууль тогтоомжид нийцээгүй бол Засгийн газар өөрөө буюу Улсын Их Хурал хүчингүй болгоно.", "provisions": [{"pid": "45.2", "kind": "procedure", "actor": "Засгийн газар/УИХ", "summary": "Хууль тогтоомжид нийцээгүй тогтоолыг хүчингүй болгоно", "delegates": false, "limits": null, "amended": []}], "findings": [], "modality": {"descriptive": 2}}, {"number": "46", "chapter": 3, "title": "Төрийн алба", "text": "Монгол Улсын яам, төрийн бусад албан газрыг хуулийн дагуу байгуулна. Монгол Улсын төрийн жинхэнэ албан хаагч Монгол Улсын иргэн байх бөгөөд Үндсэн хууль, бусад хуулийг чандлан баримталж ард түмнийхээ тусын тулд, иргэний ёсоор төрийн ашиг сонирхолд захирагдан ажиллана. Төрийн албан хаагчийн ажиллах нөхцөл, баталгааг хуулиар тогтооно.", "provisions": [{"pid": "46.1", "kind": "delegation", "actor": "УИХ", "summary": "Яам, албан газрыг хуулийн дагуу", "delegates": true, "limits": null, "amended": []}, {"pid": "46.3", "kind": "delegation", "actor": "УИХ", "summary": "Албан хаагчийн баталгааг хуулиар", "delegates": true, "limits": null, "amended": []}], "findings": [13, 13], "modality": {"descriptive": 3}}, {"number": "47", "chapter": 3, "title": "Шүүх эрх мэдэл", "text": "Монгол Улсад шүүх эрх мэдлийг гагцхүү шүүх хэрэгжүүлнэ. Ямар ч нөхцөлд хуулиас гадуур шүүх байгуулах, шүүх эрх мэдлийг өөр байгууллага эрхлэн хэрэгжүүлэхийг хориглоно. Шүүхийг зөвхөн Үндсэн хууль, бусад хуулийн дагуу байгуулна.", "provisions": [{"pid": "47.1", "kind": "declaration", "actor": "шүүх", "summary": "Шүүх эрх мэдлийг гагцхүү шүүх", "delegates": false, "limits": null, "amended": []}, {"pid": "47.2", "kind": "prohibition", "actor": "", "summary": "Хуулиас гадуур шүүх байгуулахыг хориглоно", "delegates": false, "limits": null, "amended": []}], "findings": [], "modality": {"descriptive": 2, "prohibition": 1}}, {"number": "48", "chapter": 3, "title": "Шүүхийн тогтолцоо", "text": "Шүүхийн үндсэн тогтолцоо Улсын дээд шүүх, аймаг, нийслэлийн шүүх, сум буюу сум дундын, дүүргийн шүүхээс бүрдэх бөгөөд шүүхийг тойргийн зарчмаар байгуулж болно. Шүүхийг эрүү, иргэн, захиргааны зэрэг шүүн таслах ажлын төрлөөр дагнан байгуулж болно. Дагнасан шүүхийн үйл ажиллагаа, шийдвэр нь Улсын дээд шүүхийн хяналтаас гадуур байж үл болно. Шүүхийн зохион байгуулалт, үйл ажиллагааны эрх зүйн үндсийг хуулиар тогтооно. Шүүх улсын төсвөөс санхүүжинэ. Шүүх үйл ажиллагаагаа явуулах эдийн засгийн баталгааг төр хангана.", "provisions": [{"pid": "48.1", "kind": "declaration", "actor": "", "summary": "Улсын дээд шүүх, аймаг, сумын шүүх; дагнасан шүүх", "delegates": false, "limits": null, "amended": [2019]}, {"pid": "48.2", "kind": "delegation", "actor": "УИХ", "summary": "Шүүхийн зохион байгуулалтыг хуулиар", "delegates": true, "limits": null, "amended": []}, {"pid": "48.3", "kind": "duty", "actor": "төр", "summary": "Шүүх улсын төсвөөс санхүүжиж, эдийн засгийн баталгааг төр хангана (хэмжээ заагаагүй)", "delegates": false, "limits": null, "amended": []}], "findings": [13], "modality": {"permission": 2, "prohibition": 1, "descriptive": 2, "obligation": 1}}, {"number": "49", "chapter": 3, "title": "Шүүхийн хараат бус байдал", "text": "Шүүгч хараат бус байж, гагцхүү хуульд захирагдана. Ерөнхийлөгч, Ерөнхий сайд, Улсын Их Хурлын ба Засгийн газрын гишүүн, төр, нам, олон нийтийн бусад байгууллагын албан тушаалтан, иргэн хэн боловч шүүгчээс шүүн таслах үүргээ хэрэгжүүлэхэд хөндлөнгөөс оролцож болохгүй. Шүүгчийн хараат бус, шүүхийн бие даасан байдлыг хангах зорилгоор Шүүхийн ерөнхий зөвлөл ажиллана. Шүүхийн ерөнхий зөвлөл шүүх, шүүгчийн шүүн таслах ажиллагаанд оролцохгүйгээр, гагцхүү хуульчдаас шүүгчийг шилж олох, эрх ашгийг нь хамгаалах зэрэг шүүхийг бие даан ажиллах нөхцөлөөр хангахтай холбогдсон үүргийг биелүүлнэ. Шүүхийн ерөнхий зөвлөлийн гишүүдийн тавыг шүүгчид дотроосоо сонгож, бусад таван гишүүнийг нээлттэйгээр нэр дэвшүүлж томилно. Тэдгээр нь дөрвөн жилийн хугацаагаар зөвхөн нэг удаа ажиллах бөгөөд Зөвлөлийн даргыг гишүүд дотроосоо сонгоно. Шүүгчийн хараат бус байдлыг хангахтай холбоотой Зөвлөлийн үйл ажиллагааны тайланг Улсын дээд шүүхэд танилцуулна. Зөвлөлийн зохион байгуулалт, үйл ажиллагааны журам, бүрэлдэхүүнд тавих шаардлага, томилох журмыг хуулиар тогтооно. Хуульд заасан үндэслэл, журмын дагуу шүүгчийг албан тушаалаас нь түдгэлзүүлэх, огцруулах болон сахилгын бусад шийтгэл ногдуулах чиг үүрэг бүхий Шүүхийн сахилгын хороо ажиллах бөгөөд түүний бүрэн эрх, зохион байгуулалт, үйл ажиллагааны журам, бүрэлдэхүүнд тавих шаардлага, томилох журмыг хуулиар тогтооно.", "provisions": [{"pid": "49.1", "kind": "declaration", "actor": "шүүгч", "summary": "Хараат бус, гагцхүү хуульд захирагдана", "delegates": false, "limits": null, "amended": []}, {"pid": "49.2", "kind": "prohibition", "actor": "хэн боловч", "summary": "Шүүгчид хөндлөнгөөс оролцохгүй", "delegates": false, "limits": null, "amended": []}, {"pid": "49.5", "kind": "procedure", "actor": "?", "summary": "ШЕЗ: 5 гишүүнийг шүүгчид сонгож, 5-ыг «нээлттэйгээр нэр дэвшүүлж томилно» (хэн томилох нь заагаагүй)", "delegates": true, "limits": null, "amended": [2019]}, {"pid": "49.6", "kind": "delegation", "actor": "УИХ", "summary": "Шүүхийн сахилгын хороог хуулиар", "delegates": true, "limits": null, "amended": [2019]}], "findings": [4, 13, 13], "modality": {"descriptive": 8, "prohibition": 1}}, {"number": "50", "chapter": 3, "title": "Улсын дээд шүүх", "text": "Монгол Улсын дээд шүүх бол шүүхийн дээд байгууллага мөн бөгөөд дараахь бүрэн эрхийг хэрэгжүүлнэ: хуулиар харьяалуулсан эрүүгийн хэрэг, эрх зүйн маргааныг анхан шатны журмаар хянан шийдвэрлэх; давж заалдах болон хяналтын журмаар доод шатны шүүхийн шийдвэрийг хянан үзэх; хууль, түүнд заасан хүний эрх, эрх чөлөөг хамгаалах талаар Үндсэн хуулийн цэц, Улсын ерөнхий прокуророос шилжүүлсэн асуудлыг хянан шийдвэрлэх; Үндсэн хуулиас бусад хуулийг зөв хэрэглэх талаар албан ёсны тайлбар гаргах; хуулиар эрх олгосон бусад асуудлыг шийдвэрлэх. Улсын дээд шүүхийн шийдвэр шүүхийн эцсийн шийдвэр байх бөгөөд түүнийг бүх шүүх, бусад этгээд заавал биелүүлнэ. Хэрэв Улсын дээд шүүхийн шийдвэр хуульд харшилбал түүнийг Улсын дээд шүүх өөрөө хүчингүй болгоно. Улсын дээд шүүхийн тайлбар хуульд харшилбал хуулийг дагаж биелүүлнэ. Улсын дээд шүүх, бусад шүүх нь Үндсэн хуульд нийцээгүй, албан ёсоор нийтлээгүй хуулийг хэрэглэх эрхгүй.", "provisions": [{"pid": "50.1.4", "kind": "power", "actor": "Улсын дээд шүүх", "summary": "Үндсэн хуулиас бусад хуулийн албан ёсны тайлбар", "delegates": false, "limits": null, "amended": []}, {"pid": "50.3", "kind": "prohibition", "actor": "шүүх", "summary": "Үндсэн хуульд нийцээгүй хуулийг хэрэглэх эрхгүй", "delegates": false, "limits": null, "amended": []}], "findings": [], "modality": {"descriptive": 8, "obligation": 1, "prohibition": 1}}, {"number": "51", "chapter": 3, "title": "Шүүгч томилох", "text": "Улсын дээд шүүх Ерөнхий шүүгч, шүүгчдээс бүрдэнэ. Шүүхийн ерөнхий зөвлөлөөс Улсын дээд шүүхийн шүүгчдийг Улсын Их Хуралд танилцуулснаар, бусад шүүхийн шүүгчдийг Шүүхийн ерөнхий зөвлөлийн санал болгосноор тус тус Ерөнхийлөгч томилно. Ерөнхий шүүгчийг Улсын дээд шүүхийн санал болгосноор гишүүдийнх нь дотроос зургаан жилийн хугацаагаар Ерөнхийлөгч томилно. Хууль зүйн дээд боловсролтой, мэргэжлээрээ арваас доошгүй жил ажилласан, Монгол Улсын гучин таван нас хүрсэн иргэнийг Улсын дээд шүүхийн шүүгчээр; хууль зүйн дээд боловсролтой, гурваас доошгүй жил мэргэжлээрээ ажилласан, Монгол Улсын хорин таван нас хүрсэн иргэнийг бусад шүүхийн шүүгчээр томилж болно. Үндсэн хууль, шүүхийн тухай хуульд заасан үндэслэл, шүүхийн хүчин төгөлдөр шийдвэрийн дагуу огцруулах, эсхүл хүсэлтээр нь чөлөөлөхөөс бусад тохиолдолд аль ч шатны шүүхийн шүүгчийг огцруулахыг хориглоно.", "provisions": [{"pid": "51.2", "kind": "procedure", "actor": "Ерөнхийлөгч", "summary": "ШЕЗ-ийн саналаар шүүгч томилно (татгалзах хугацаа, үндэслэл заагаагүй)", "delegates": false, "limits": null, "amended": []}, {"pid": "51.4", "kind": "prohibition", "actor": "", "summary": "Хууль, шүүхийн шийдвэрээс бусдаар шүүгчийг огцруулахыг хориглоно", "delegates": false, "limits": null, "amended": []}], "findings": [], "modality": {"descriptive": 4, "permission": 1, "prohibition": 1}}, {"number": "52", "chapter": 3, "title": "Хамтын зарчим", "text": "Бүх шатны шүүх хэрэг, маргааныг хамтын зарчмаар хянан хэлэлцэж шийдвэрлэнэ. Анхан шатны шүүх хэрэг, маргааныг хамтран шийдвэрлэхдээ иргэдийн төлөөлөгчдийг хуульд заасан журмын дагуу оролцуулна. Хуульд тусгайлан зүйлчилж заасан зарим хэргийг шүүгч дангаар хянан шийдвэрлэж болно.", "provisions": [{"pid": "52.1", "kind": "declaration", "actor": "шүүх", "summary": "Хамтын зарчмаар шийдвэрлэнэ", "delegates": false, "limits": null, "amended": []}], "findings": [], "modality": {"descriptive": 2, "permission": 1}}, {"number": "53", "chapter": 3, "title": "Шүүхийн хэл", "text": "Шүүн таслах ажиллагааг монгол хэлээр явуулна. Монгол хэл мэдэхгүй хүнд хэргийн баримт сэлтийг хэлмэрчлүүлэн бүрэн танилцуулах бөгөөд шүүх хуралдаан дээр эх хэлээр нь үг хэлэх эрх олгоно.", "provisions": [{"pid": "53.2", "kind": "right", "actor": "шүүгдэгч", "summary": "Хэлмэрч, эх хэлээр үг хэлэх эрх", "delegates": false, "limits": null, "amended": []}], "findings": [], "modality": {"descriptive": 2}}, {"number": "54", "chapter": 3, "title": "Ил шүүх", "text": "Хуульд тусгайлан зааснаас бусад тохиолдолд шүүх хэргийг ил таслан шийдвэрлэнэ.", "provisions": [{"pid": "54", "kind": "declaration", "actor": "шүүх", "summary": "Хуульд зааснаас бусад тохиолдолд ил", "delegates": true, "limits": null, "amended": []}], "findings": [13], "modality": {"descriptive": 1}}, {"number": "55", "chapter": 3, "title": "Өмгөөлөх эрх", "text": "Шүүгдэгч өөрийгөө өмгөөлөх эрхтэй. Шүүгдэгчид энэ эрхээ эдлэхэд хүсэлтээр нь буюу хуульд зааснаар хууль зүйн мэргэжлийн туслалцаа үзүүлнэ.", "provisions": [{"pid": "55.1", "kind": "right", "actor": "шүүгдэгч", "summary": "Өөрийгөө өмгөөлөх, хууль зүйн туслалцаа", "delegates": false, "limits": null, "amended": []}], "findings": [], "modality": {"right": 1, "descriptive": 1}}, {"number": "56", "chapter": 3, "title": "Прокурор", "text": "Прокурор хэрэг бүртгэх, мөрдөн байцаах, ял эдлүүлэх ажиллагаанд хяналт тавьж, шүүх хуралдаанд төрийн нэрийн өмнөөс оролцоно. Улсын ерөнхий прокурор, түүний орлогч нарыг Улсын Их Хуралтай зөвшилцөн Ерөнхийлөгч зургаан жилийн хугацаагаар томилно. Монгол Улсын прокурорын байгууллагын тогтолцоо, зохион байгуулалт, үйл ажиллагааны эрх зүйн үндсийг хуулиар тогтооно.", "provisions": [{"pid": "56.2", "kind": "procedure", "actor": "Ерөнхийлөгч", "summary": "УИХ-тай зөвшилцөн Ерөнхий прокурорыг 6 жилээр томилно", "delegates": false, "limits": null, "amended": []}, {"pid": "56.3", "kind": "delegation", "actor": "УИХ", "summary": "Прокурорын тогтолцоог хуулиар", "delegates": true, "limits": null, "amended": []}], "findings": [13, 25, 40], "modality": {"descriptive": 3}}, {"number": "57", "chapter": 4, "title": "Засаг захиргааны нэгж", "text": "Монгол Улсын нутаг дэвсгэр засаг захиргааны хувьд аймаг, нийслэлд, аймаг нь суманд, сум нь багт, нийслэл нь дүүрэгт, дүүрэг нь хороонд хуваагдана. Засаг захиргаа, нутаг дэвсгэрийн нэгж дэх улсын болон орон нутгийн зэрэглэлтэй хотын, түүнчлэн тосгоны өөрийн удирдлага, зохион байгуулалтын эрх зүйн үндсийг хуулиар тогтооно. Хот, тосгонд засаг захиргаа, нутаг дэвсгэрийн нэгж, түүний удирдлагын зарим чиг үүргийг шилжүүлэх асуудлыг Засгийн газрын өргөн мэдүүлснээр Улсын Их Хурал шийдвэрлэнэ. Засаг захиргаа, нутаг дэвсгэрийн нэгжийг өөрчлөх асуудлыг эдийн засгийн бүтэц, хүн амын байршлыг харгалзан, тухайн нутгийн иргэдийн саналыг үндэслэн Засгийн газрын өргөн мэдүүлснээр Улсын Их Хурал шийдвэрлэнэ.", "provisions": [{"pid": "57.1", "kind": "declaration", "actor": "", "summary": "Аймаг, нийслэл, сум, баг, дүүрэг, хороо", "delegates": false, "limits": null, "amended": []}, {"pid": "57.3", "kind": "procedure", "actor": "УИХ", "summary": "Нэгжийг өөрчлөхдөө иргэдийн саналыг үндэслэнэ (санал заавал биш)", "delegates": false, "limits": null, "amended": [2019]}], "findings": [], "modality": {"descriptive": 4}}, {"number": "58", "chapter": 4, "title": "Нэгжийн хил", "text": "Аймаг, нийслэл, сум, дүүрэг бол хуулиар тусгайлан олгосон чиг үүрэг, өөрийн удирдлага бүхий засаг захиргаа, нутаг дэвсгэр, эдийн засаг, нийгмийн цогцолбор мөн. Аймаг, нийслэл, сум, дүүргийн хилийн цэсийг Засгийн газрын өргөн мэдүүлснээр Улсын Их Хурал батална.", "provisions": [{"pid": "58.2", "kind": "power", "actor": "УИХ", "summary": "Хилийн цэсийг Засгийн газрын өргөн мэдүүлснээр батална", "delegates": false, "limits": null, "amended": []}], "findings": [], "modality": {"descriptive": 2}}, {"number": "59", "chapter": 4, "title": "Нутгийн өөрөө удирдах ёс", "text": "Монгол Улсын засаг захиргаа, нутаг дэвсгэрийн нэгжийн удирдлага нь нутгийн өөрөө удирдах ёсыг төрийн удирдлагатай хослуулах үндсэн дээр хэрэгжинэ. Нутгийн өөрөө удирдах байгууллага нь аймаг, нийслэл, сум, дүүрэгт тухайн нутаг дэвсгэрийн иргэдийн Төлөөлөгчдийн Хурал, баг, хороонд иргэдийн Нийтийн Хурал байна. Аймаг, нийслэл, сум, дүүргийн иргэдийн Төлөөлөгчдийн Хурал хуулиар тогтоосон хязгаарын хүрээнд өмчийн удирдлагыг хэрэгжүүлэх, татварын хувь хэмжээг тогтоох эрхтэй. Нутгийн өөрөө удирдах байгууллагын чиг үүрэг, төсвийн харилцааны үндсийг тухайн нутаг дэвсгэрийн эдийн засаг, нийгмийн амьдралын тодорхой онцлогт нийцүүлэн хуулиар тогтоож болно. Аймаг, нийслэлийн Төлөөлөгчдийн Хурлыг дөрвөн жилийн хугацаагаар сонгоно. Эдгээр Хурлын болон сум, дүүргийн Хурлын төлөөлөгчдийн тоо, сонгох журмыг хуулиар тогтооно.", "provisions": [{"pid": "59.2", "kind": "power", "actor": "Төлөөлөгчдийн Хурал", "summary": "Хуулийн хүрээнд өмч удирдах, татварын хувь тогтоох", "delegates": true, "limits": "хуулиар тогтоосон хязгаар", "amended": [2019]}, {"pid": "59.3", "kind": "delegation", "actor": "УИХ", "summary": "Хурлын сонгуулийн журмыг хуулиар", "delegates": true, "limits": null, "amended": []}], "findings": [13], "modality": {"descriptive": 4, "right": 1, "permission": 1}}, {"number": "60", "chapter": 4, "title": "Засаг дарга", "text": "Аймаг, нийслэл, сум, дүүрэг, баг, хорооны нутаг дэвсгэрт төрийн удирдлагыг тухайн аймаг, нийслэл, сум, дүүрэг, баг, хорооны Засаг дарга хэрэгжүүлнэ. Засаг даргыг тухайн аймаг, нийслэл, сум, дүүрэг, баг, хорооны Хурлаас нэр дэвшүүлж, аймаг, нийслэлийн Засаг даргыг Ерөнхий сайд; сум, дүүргийн Засаг даргыг харьяалах аймаг, нийслэлийн Засаг дарга; баг, хорооны Засаг даргыг харьяалах сум, дүүргийн Засаг дарга тус тус дөрвөн жилийн хугацаагаар томилно. Ерөнхий сайд буюу дээд шатны нэгжийн Засаг дарга доод шатныхаа нэгжийн Засаг даргад нэр дэвшигчийг томилохоос татгалзвал энэ зүйлийн 2 дахь хэсэгт заасан журмаар дахин нэр дэвшүүлж томилтол өмнөх Засаг дарга бүрэн эрхээ хэвээр хадгална.", "provisions": [{"pid
